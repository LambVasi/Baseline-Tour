  const wk = state.team ? (state.team.kind==='davis' ? 'Davis Cup' : 'Laver Cup') : state.tour ? 'Tournament' : 'This week';
  const nOff = P.offers.filter(o=>o.exp>state.absWeek).length;
  const tabs = [['week', wk], ['player','Player'], ['sponsors', `Sponsors${nOff?` (${nOff})`:''}`], ['schedule','Schedule'], ['rank','Rankings'], ['history','History'], ['career','Career'], ['saves','Saves']];
  return `<header class="topbar"><div class="inner">
    <div class="brand"><i></i>Baseline Tour<button class="replaybtn" data-act="replay-intro" title="Replay the intro">▶ Intro</button></div>
    <div class="plate">
      <div><span>Player</span><b>${esc(P.name)} · ${esc(P.country)}</b></div>
      <div><span>Week</span><b>${state.season} · W${state.week}</b></div>
      <div><span>Rank</span><b>${rk?'No. '+rk:'—'}</b></div>
      <div><span>Points</span><b>${state.rankPts.you||0}</b></div>
      <div><span>Bank</span><b>${money(P.money)}</b></div>
      <div><span>Fatigue</span><b>${Math.round(P.fatigue)} · ${f.word}</b></div>
    </div></div>
    ${state.over?'':`<nav class="tabs">${tabs.map(([k,l])=>`<button class="tab ${ui.tab===k?'on':''}" data-act="tab" data-v="${k}">${l}</button>`).join('')}</nav>`}
  </header>`;
}

function evCard(ev){
  const T = TIERS[ev.tier], el = eligibility(ev), s = ms();
  const pill = el.type==='main' ? `<span class="pill main">${ev.tier==='OLY'?'Selected':'Main draw'}</span>` : el.type==='qual' ? `<span class="pill qual">Qualifying · ${T.qr} rds</span>` : `<span class="pill no">${esc(el.why)}</span>`;
  const reward = ev.tier==='OLY' ? `Gold medal${ev.noPts?', no ranking points':`, ${T.pts[0]} pts`}` : `Winner ${T.pts[0]} pts, ${money(T.prize[0]*s)}`;
  return `<div class="ev s-${ev.surface}">
    <div class="tierbadge">${tierShort(ev.tier)}<small>${T.draw} draw</small></div>
    <div><div class="name">${esc(evName(ev))}</div>
      <div class="meta"><span class="surf"><i></i>${SURF[ev.surface].name}</span> · Best of ${T.bo} · ${reward}${ev.weeks===2?' · 2 weeks':''}${T.travel?` · Travel ${money(T.travel*s*TRAVEL_MULT)}`:''}</div>${(()=>{ const D = dblState(); if(!DBL_TIERS[ev.tier] || !D.on) return ''; const de = dblEntry(ev); return `<div class="meta" style="margin-top:2px">${de.ok ? `Doubles with ${esc(de.partner ? de.partner.name : 'a partner from your country')} too` : `No doubles: ${esc(de.why.toLowerCase())}`}</div>`; })()}</div>
    <div class="right">${pill}<button class="btn ${el.type==='no'?'':'primary'} sm" data-act="enter" data-v="${ev.id}" ${el.type==='no'?'disabled':''}>Enter</button></div>
  </div>`;
}
function laverCard(){
  const L = state.laverPlan; if(!L || L.played) return '';
  const side = L.eu.includes('you') ? 'Team Europe' : 'Team World';
  if(!L.invited) return `<div class="ev s-indoor"><div class="tierbadge">Laver<small>team event</small></div><div><div class="name">Laver Cup, ${esc(L.city)}</div><div class="meta">Team Europe vs Team World. The top six players on each side are picked by ranking. You were not picked this year.</div></div><div class="right"><span class="pill no">Not selected</span></div></div>`;
  return `<div class="ev s-indoor"><div class="tierbadge">Laver<small>team event</small></div><div><div class="name">Laver Cup, ${esc(L.city)}</div><div class="meta">You are picked for ${side}. Three days, 1, 2 and 3 points per match, first to 13. Appearance fee plus ${money(250000*ms())} each for the winners. No ranking points.</div></div><div class="right"><span class="pill main">Invited</span><button class="btn primary sm" data-act="laver" ${state.player.injured?'disabled':''}>Join team</button></div></div>`;
}

function renderHub(){
  const P = state.player, f = fatigueMeter(P.fatigue);
  const evs = state.evs.slice().sort((a,b)=>TIERS[b.tier].rank-TIERS[a.tier].rank);
  const upcoming = [];
  for(let i=1;i<=8;i++){
    let w = state.week+i, y = state.season; if(w>52){ w-=52; y++; }
    const tour = weekEvents(w, y).filter(e=>TIERS[e.tier].rank>=4);
    const dvi = y===state.season && state.davis && !state.davis.winner ? DAVIS_WEEKS.indexOf(w) : -1;
    const lv = (w===LAVER_WEEK && laverCity(y) ? `<span class="surf s-indoor"><i></i>Laver Cup ${esc(laverCity(y))}</span>` : '') + (dvi>=state.davis?.round && state.davis.alive.includes(state.player.country) ? `<span class="surf s-hard"><i></i>Davis Cup ${DAVIS_ROUNDS[dvi].toLowerCase()}</span>` : '');
    upcoming.push(`<div><span class="wk">W${w}</span><span class="e">${tour.length||lv ? tour.map(e=>`<span class="surf s-${e.surface}"><i></i>${esc(evName(e))}</span>`).join('')+lv : '<span class="muted">Challengers and Futures only</span>'}</span></div>`);
  }
  const report = ui.report ? `<div class="card report"><div class="between"><h3 style="margin:0">${esc(ui.report.title)}</h3><button class="btn sm" data-act="dismiss">Dismiss</button></div><ul>${ui.report.lines.map(l=>`<li>${l}</li>`).join('')}</ul></div>` : '';
  const warn = P.fatigue>=65 ? `<p class="neg" style="font-size:14px">You are running on fumes. Playing like this lowers your level and raises the risk of injury.</p>` : '';
  const nOff = P.offers.filter(o=>o.exp>state.absWeek).length;
  const offerNote = nOff ? `<div class="card report" style="border-left-color:var(--warn)"><div class="between"><span><b>${nOff} sponsorship offer${nOff>1?'s':''}</b> waiting on your agent's desk.</span><button class="btn sm" data-act="tab" data-v="sponsors">Review offers</button></div></div>` : '';
  const coach = COACHES[P.coach];
  return `<div class="hub">
    <div class="stack">
      <div class="weekhead"><div><p class="eyebrow">Season ${state.season} · Week ${state.week} of 52 · ${esc(eraOf(state.era).name)} era</p><h2>Week of ${weekDate(state.season,state.week)}, ${state.season}</h2></div></div>
      ${report}${offerNote}
      ${(P.tourStreak||0)>=3?`<p class="neg" style="font-size:14px">You have played ${P.tourStreak} tournaments in a row. Every extra week on the road adds more fatigue. A rest or training week resets it.</p>`:''}
      ${P.money<0?`<p class="neg" style="font-size:14px">You are ${money(-P.money)} in debt and paying 0.5% interest every week. Cheaper living or a few good results will help.</p>`:''}
      <div class="status">
        <div class="stat"><span class="k">Fatigue</span><span class="val">${Math.round(P.fatigue)}</span>${f.bar}<span class="muted" style="font-size:12px">${f.word}${P.injured?` · <span class="neg">Injured ${P.injured} wk</span>`:''}</span></div>
        <div class="stat"><span class="k">Overall</span><span class="val">${ovr(P.attrs).toFixed(1)}</span><span class="muted" style="font-size:12px">${STYLES[P.style].name} · age ${ageOf(P)}</span></div>
        <div class="stat"><span class="k">Form</span><div class="form">${P.form.length?P.form.slice(-8).map(r=>`<span class="${r}">${r}</span>`).join(''):'<span class="none">No matches yet</span>'}</div><span class="muted" style="font-size:12px">Season ${P.season.w}–${P.season.l}</span></div>
      </div>
      ${warn}
      <div><h3 style="margin-bottom:10px">Tournaments this week</h3>
        <div class="evs">${davisCard()}${laverCard()}${evs.length?evs.map(evCard).join(''):`<div class="card"><p class="muted">No tournaments this week. It is the off-season, so it is a good time to train.</p></div>`}</div></div>
      <div class="offtour">
        <div class="card">
          <h3>Train</h3>
          <p class="muted" style="font-size:13px">${esc(coachName())} · ×${coach.mult}${P.trait==='learner'?' · quick learner ×1.25':''}. Focused work raises one skill, all-round work nudges every skill a little.</p>
          <div class="chips">${ATTRS.map(([k,l])=>`<button class="chip ${ui.focus===k?'on':''}" data-act="focus" data-v="${k}">${l} ${Math.round(P.attrs[k])}</button>`).join('')}<button class="chip ${ui.focus==='all'?'on':''}" data-act="focus" data-v="all">All-round</button></div>
          ${(P.trainStreak||0)>=2?`<p class="neg" style="font-size:13px;margin-bottom:8px">You have trained ${P.trainStreak} weeks in a row. Training again risks overtraining: a ${Math.round(overtrainRisk(P.trainStreak)*100)}% chance of injury. Rest or play a tournament to reset.</p>`:(P.trainStreak===1?'<p class="muted" style="font-size:13px;margin-bottom:8px">One more training week is safe. After two in a row you risk overtraining.</p>':'')}
          <button class="btn ${(P.trainStreak||0)>=2?'danger':'primary'}" data-act="train" ${P.injured?'disabled':''}>${(P.trainStreak||0)>=2?'Train anyway':'Train this week'}</button>
        </div>
        <div class="card">
          <h3>Rest</h3>
          <p class="muted" style="font-size:13px">Skip the week and recover. Clears about 29 fatigue in total, more with a better lifestyle or a physio. ${P.injured?'Also counts as rehab.':''}</p>
          <div style="margin-top:12px"><button class="btn" data-act="rest">Rest this week</button></div>
        </div>
      </div>
    </div>
    <div class="stack">
      ${state.era==='dudes'?dudesTable(true):''}
      <div class="card"><h3>Coming up</h3><div class="upc">${upcoming.join('')}</div></div>
      <div class="card"><h3>Tour news</h3><div class="news">${state.news.slice(0,12).map(n=>`<div><span class="when">${n.w}</span><span class="${n.you?'you':''}">${esc(n.t)}</span></div>`).join('')}</div></div>
    </div>
  </div>`;
}

function oppCard(o, oppId, isFiller, label, seeds, playAct, quickAct, canWithdraw){
  const P = state.player, ork = isFiller ? null : rankOf(oppId), h = state.h2h[oppId] || [0,0], g = gear(P);
  const cmp = ATTRS.map(([k,l]) => { const a=Math.min(99,P.attrs[k]+(g[k]||0)), b=o.attrs[k]; return `<div class="cmprow"><span class="l" style="${a>b+2?'color:var(--good);font-weight:600':''}">${Math.round(a)}</span><div class="half left"><i style="width:${a}%"></i></div><span class="lab">${l}</span><div class="half right"><i style="width:${b}%"></i></div><span class="rr" style="${b>a+2?'color:var(--bad);font-weight:600':''}">${Math.round(b)}</span></div>`; }).join('');
  const f = fatigueMeter(P.fatigue);
  return `<div class="card opp">
      <div class="between"><p class="eyebrow">${esc(label)}</p><span class="mono muted" style="font-size:12px">H2H ${h[0]}–${h[1]}</span></div>
      <div class="vs">
        <div class="side"><span class="nm">${esc(last(P.name))}</span><span class="sub">${P.country} · No. ${rankOf('you')||'—'}${seeds&&seeds.you?` · Seed ${seeds.you}`:''}</span><span class="sub">OVR ${ovr(P.attrs).toFixed(0)} · ${STYLES[P.style].name}</span></div>
        <span class="mid">vs</span>
        <div class="side r"><span class="nm">${isFiller?esc(last(o.name)):`<button class="linkbtn" data-act="profile" data-v="${oppId}">${esc(last(o.name))}</button>`}</span><span class="sub">${esc(o.name)} · ${esc(o.country)}</span><span class="sub">${ork?'No. '+ork:(isFiller?'Qualifier':'Unranked')}${seeds&&seeds[oppId]?` · Seed ${seeds[oppId]}`:''} · OVR ${ovr(o.attrs).toFixed(0)}</span><span class="sub">${STYLES[o.style].name} · ${ageOf(o)}y</span></div>
      </div>
      ${(!isFiller && state.era==='dudes' && state.player.dude && AI(oppId) && AI(oppId).dude) ? clashCard(o, oppId, label) : ''}
      ${(()=>{ if(isFiller || !isRival(oppId) || (state.era==='dudes' && AI(oppId) && AI(oppId).dude)) return ''; const x = (state.h2hx||{})[oppId]||{};
        return `<div class="rivalbar"><span class="rt">${rivalTag(oppId)}</span><span>${leadText(oppId, o.name)}${x.fin&&(x.fin[0]+x.fin[1])?` · finals ${x.fin[0]}–${x.fin[1]}`:''}. A win here is worth extra fame.</span>${meetChips(oppId)}${x.rev?`<span class="pos" style="font-size:13px">You promised revenge after the last meeting. You start this one fired up.</span>`:''}${x.heat>=2?`<span class="neg" style="font-size:13px">${esc(last(o.name))} has not forgotten your comments. He is fired up too.</span>`:''}</div>`; })()}
      ${(()=>{ const C = COND[curCond()]; return `<div class="condline"><b>${esc(C.name)}</b> · ${esc(C.note)}</div>`; })()}
      <div class="cmp">${cmp}</div>
      <div><p class="eyebrow" style="margin-bottom:8px">Game plan <span class="muted" style="text-transform:none;letter-spacing:0">· you can change it during the match${hasPers('tactician')?' · your tactician coach makes it 50% stronger':''}</span></p>
        <div class="tactics">${Object.entries(TACTICS).map(([k,v])=>`<button class="tactic ${ui.tactic===k?'on':''}" data-act="tactic" data-v="${k}"><b>${v.name}</b><span>${v.note}</span></button>`).join('')}</div></div>
      <p class="muted" style="font-size:13px">Fatigue ${Math.round(P.fatigue)} (${f.word.toLowerCase()}). Each point of fatigue costs you about 0.12 on every attribute during the match.${g.srv||g.spd?' Your numbers include sponsor gear.':''}</p>
      <div class="actions"><button class="btn primary" data-act="${playAct}">Play match</button><button class="btn" data-act="${quickAct}">Simulate result</button>${canWithdraw?'<button class="btn danger sm" data-act="withdraw" style="margin-left:auto">Withdraw</button>':''}</div>
    </div>`;
}

function renderTour(){
  const t = state.tour, T = TIERS[t.ev.tier], ev = t.ev, P = state.player, s = ms();
  const head = `<div class="band s-${ev.surface}"><div><p class="eyebrow">${T.label} · ${SURF[ev.surface].name} · ${state.season}${t.type==='qual'?' · via qualifying':''}</p><h2>${esc(evName(ev))}</h2></div>
    <div class="facts"><span>${T.draw}-player draw</span><span>Best of ${t.stage==='qual'?3:T.bo}</span>${t.dt?`<span>Doubles with ${esc(last(getP(t.dt.partner,t)?.name||'partner'))}</span>`:''}${ev.tier==='OLY'?`<span>Gold, silver and bronze</span><span>${ev.noPts?'No ranking points':T.pts[0]+' pts for gold'}</span>`:`<span>Winner ${T.pts[0]} pts</span><span>${money(T.prize[0]*s)}</span>`}</div></div>`;
  const path = t.log.length ? t.log.map(l=>`<div><span class="rd">${esc(l.rd)}</span><span>${l.won?'Beat':'Lost to'} ${nameBtn(l.oppId, l.opp)}</span><span class="sc"><span class="res ${l.won?'W':'L'}">${l.won?'W':'L'}</span> ${esc(l.score)}</span></div>`).join('') : `<p class="muted">Your first match is up next.</p>`;
  const sDone = (t.userOut || t.champion) && !t.bronzePending;
  const done = sDone && dDone(t);
  const seedsAlive = Object.entries(t.seeds).filter(([id])=>t.alive.includes(id) && id!=='you').sort((a,b)=>a[1]-b[1]).slice(0,8);
  const dpath = t.dt ? (t.dt.log.length ? t.dt.log.map(l=>`<div><span class="rd">${esc(l.rd)}</span><span>${l.won?'Beat':'Lost to'} ${esc(l.opp)}</span><span class="sc"><span class="res ${l.won?'W':'L'}">${l.won?'W':'L'}</span> ${esc(l.score)}</span></div>`).join('') : `<p class="muted">Your first doubles match is up next.</p>`) : '';
  const side = `<div class="stack"><div class="card"><h3>Your path${t.dt?' · singles':''}</h3><div class="path">${path}</div></div>${t.dt?`<div class="card"><h3>Doubles with ${esc(getP(t.dt.partner,t)?.name||'your partner')}</h3><div class="path">${dpath}</div>${dDone(t)?`<p style="margin-top:8px"><b>${esc(dOutcome(t).label)}</b></p>`:''}</div>`:''}
    ${seedsAlive.length&&!done?`<div class="card"><h3>Seeds still in</h3><div class="path">${seedsAlive.map(([id,sd])=>`<div><span>[${sd}] ${nameBtn(id, getP(id,t).name)}</span><span class="mono muted">No. ${rankOf(id)||'—'}</span></div>`).join('')}</div></div>`:''}</div>`;
  if(done){
    const o = tourOutcome(t), champ = getP(t.champion, t);
    return `<div class="stack">${head}<div class="tourgrid"><div class="card outcome">
      <p class="eyebrow">Tournament over</p>
      <div class="big" style="color:${o.idx===0||o.medal?'var(--good)':'var(--ink)'}">${esc(o.label)}</div>
      ${o.idx!==0?`<p class="muted">${nameBtn(t.extras[t.champion]?null:t.champion, champ?.name||'A qualifier')} won ${ev.tier==='OLY'?'gold':'the title'}.</p>`:ev.tier==='OLY'?'<p>Olympic champion.</p>':`<p>Your ${ordinal(P.stats.titles.length+1)} career title.</p>`}
      ${t.dt?`<p><b>Doubles:</b> ${esc(dOutcome(t).label)}</p>`:''}
      <div class="nums"><div><span>Points</span><b>+${o.pts}</b></div>${T.prize[0]?`<div><span>Prize</span><b>${money(o.prize)}</b></div>`:''}${T.travel?`<div><span>Travel</span><b>−${money(T.travel*s*TRAVEL_MULT)}</b></div>`:''}</div>
      <div><button class="btn primary" data-act="finish-tour">Back to the calendar</button></div>
    </div>${side}</div></div>`;
  }
  const dcard = t.dt && !dDone(t) ? dblCard(dRoundLabel(t), t.dt.teams.you, t.dt.teams[dOpp(t)], t, 'dplay', 'dquick', 'dwithdraw', t.dt.seeds.you) : '';
  if(sDone){
    const o = tourOutcome(t);
    return `<div class="stack">${head}<div class="tourgrid"><div class="stack"><div class="card"><p class="eyebrow">Singles finished</p><h3 style="margin:4px 0 0">${esc(o.label)}</h3><p class="muted" style="font-size:13px">You are still alive in the doubles.</p></div>${dcard}</div>${side}</div></div>`;
  }
  const oppId = currentOpp(t), o = getP(oppId, t);
  return `<div class="stack">${head}<div class="tourgrid"><div class="stack">${oppCard(o, oppId, !!t.extras[oppId], roundLabel(t), t.seeds, 'play', 'quick', true)}${dcard}</div>${side}</div></div>`;
}
function ordinal(n){ const s=['th','st','nd','rd'], v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); }

function davisCard(){
  const plan = state.davisPlan, D = state.davis, mine = state.player.country; if(!plan || plan.played || plan.resolved) return '';
  const t = plan.ties.find(x=>x.a===mine || x.b===mine); if(!t) return '';
  const opp = t.a===mine ? t.b : t.a, rd = DAVIS_ROUNDS[plan.round];
  const team = (t.a===mine?t.pa:t.pb).map(id=>id==='you'?'you':getP(id)?.name).join(' and ');
  if(plan.userTie<0) return `<div class="ev s-${t.surface}"><div class="tierbadge">Davis<small>national team</small></div><div><div class="name">Davis Cup ${rd.toLowerCase()}: ${esc(cname(mine))} vs ${esc(cname(opp))}</div><div class="meta">Your country picks its top two singles players. This time that is ${esc(team)}.</div></div><div class="right"><span class="pill no">Not selected</span></div></div>`;
  return `<div class="ev s-${t.surface}"><div class="tierbadge">Davis<small>national team</small></div><div><div class="name">Davis Cup ${rd.toLowerCase()}: ${esc(cname(mine))} vs ${esc(cname(opp))}</div><div class="meta">You are picked to play for ${esc(cname(mine))} alongside ${esc((t.a===mine?t.pa:t.pb).filter(x=>x!=='you').map(id=>getP(id)?.name).join(', ')||'a teammate')}. Five rubbers, first to three: two singles, a doubles, then reverse singles. Best of ${D.bo}. No ranking points.</div></div><div class="right"><span class="pill main">Selected</span><button class="btn primary sm" data-act="davis" ${state.player.injured?'disabled':''}>Play for ${esc(cname(mine))}</button></div></div>`;
}
function renderDavis(){
  const T = state.team, my = T.side, sideName = s => cname(s==='a'?T.a:T.b);
  const pname = id => id==='you' ? `<b>${esc(state.player.name)}</b>` : nameBtn(id, getP(id)?.name||'');
  const head = `<div class="band s-${T.surface}"><div><p class="eyebrow">Davis Cup ${DAVIS_ROUNDS[T.round].toLowerCase()} · ${state.season} · ${SURF[T.surface].name}</p><h2>${esc(cname(T.a))} vs ${esc(cname(T.b))}</h2></div><div class="facts"><span>Five rubbers</span><span>First to three</span><span>Best of ${T.bo}</span></div></div>`;
  const board = `<div class="board"><div class="teamscore"><div class="tn">${esc(cname(T.a))}</div><div class="num">${T.score.a} – ${T.score.b}</div><div class="tn">${esc(cname(T.b))}</div></div></div>`;
  const labels = ['Singles 1','Singles 2','Doubles','Reverse singles 1','Reverse singles 2'];
  const rows = T.rubbers.map((r,i)=>{
    const mine = r.a.includes('you')||r.b.includes('you');
    const res = r.result===undefined ? (i===T.idx && !T.done ? '<span class="pill qual">Next</span>' : '<span class="muted mono">'+(T.done?'not needed':'—')+'</span>') : `<span class="w ${r.result===my?'pos':'neg'}">${esc(sideName(r.result))}${r.score?` · ${esc(r.score)}`:''}</span>`;
    return `<div class="mrow ${mine?'me':''}"><span class="d">${labels[i].replace('Reverse singles','Rev.')}</span><span>${r.a.map(pname).join(' / ')} <span class="muted">vs</span> ${r.b.map(pname).join(' / ')}</span>${res}</div>`;
  }).join('');
  let action;
  if(T.done){
    const winSide = T.score.a>T.score.b?'a':'b', won = winSide===my;
    action = `<div class="card outcome"><p class="eyebrow">Tie over</p><div class="big" style="color:${won?'var(--good)':'var(--ink)'}">${won?'Won':'Lost'} ${Math.max(T.score.a,T.score.b)}–${Math.min(T.score.a,T.score.b)}</div><p class="muted">${esc(sideName(winSide))} ${T.round===3?'win the Davis Cup!':'go through to the '+DAVIS_ROUNDS[T.round+1].toLowerCase()+'.'}</p><div><button class="btn primary" data-act="davis-finish">Back to the calendar</button></div></div>`;
  } else {
    const r = T.rubbers[T.idx], oppId = my==='a' ? r.b[0] : r.a[0];
    const lab = `${labels[T.idx]} · ${cname(T.a)} ${T.score.a}–${T.score.b} ${cname(T.b)}`;
    action = r.type==='D' ? dblCard(lab, r[my], r[my==='a'?'b':'a'], null, 'davis-play', 'davis-quick', null) : oppCard(getP(oppId), oppId, false, lab, null, 'davis-play', 'davis-quick', false);

function renderTeam(){

function matchInner(){
  const m = state.match, sv = serverNow(m);
  const rows = [0,1].map(i => {
    const pl = m.pl[i];
    const sets = m.sets.map(s=>`<span class="sc ${s.g[i]>s.g[1-i]?'won':''}">${s.mtb?s.tb[i]:s.g[i]}${!s.mtb && s.tb && s.g[i]<s.g[1-i]?`<sup>${s.tb[i]}</sup>`:''}</span>`).join('');
    const cur = m.done ? '' : `<span class="sc cur">${m.inMTB?'·':m.g[i]}</span>`;
    const pt = m.done ? `<span class="pt empty"></span>` : `<span class="pt">${ptLabel(m,i)}</span>`;
    return `<div class="brow ${m.done&&m.winner===i?'winner':''}"><span class="srv">${!m.done&&sv===i?'<i class="ball"></i>':''}</span><span class="bname">${esc(pl.name)}</span><span class="bsets">${sets}${cur}</span>${pt}</div>`;
  }).join('');
  const st = m.stats, pct = (a,b)=> b ? Math.round(a/b*100)+'%' : '—';
  const statRows = [['Aces',st[0].aces,st[1].aces],['Double faults',st[0].df,st[1].df],['Winners',st[0].win,st[1].win],['Unforced errors',st[0].ue,st[1].ue],['Service points won',pct(st[0].svW,st[0].svT),pct(st[1].svW,st[1].svT)],['Break points won',`${st[0].bpW}/${st[0].bpT}`,`${st[1].bpW}/${st[1].bpT}`],['Total points',st[0].pts,st[1].pts],['Fatigue',Math.round(m.fat[0]),Math.round(m.fat[1])]];
  const ctrl = m.done
    ? `<div class="ctrl"><button class="btn primary" data-act="continue">${m.winner===0?'Won':'Lost'} ${esc(scoreStr(m,0))} · Continue</button></div>`
    : `<div class="ctrl"><button class="btn primary" data-act="pt">Next point</button><button class="btn" data-act="auto">${autoTimer?'Pause':'Auto-play'}</button><button class="btn" data-act="game">Finish game</button><button class="btn" data-act="set">Finish set</button><button class="btn" data-act="end">Finish match</button></div>`;
  return `<div class="board s-${m.surface}">
      <div class="top"><span>${esc(m.evName)} · ${esc(m.round)}${m.dudeClash?' · Dude vs Dude':m.rival?' · '+rivalTag(m.pl[1].id):''}</span><span>${SURF[m.surface].name} · Best of ${m.bo} · ${esc(condOf(m).name)}</span></div>
      ${rows}
      <div class="flashline">${esc(m.flash||'')}</div>
    </div>
    ${ctrl}
    ${m.done ? '' : `<div class="stylebar"><span class="eyebrow">Game plan · change it any time</span><div class="chips">${Object.entries(TACTICS).map(([k,v])=>`<button class="chip ${m.tactic===k?'on':''}" data-act="mtactic" data-v="${k}">${v.name}</button>`).join('')}</div><span class="muted" style="font-size:12.5px">${esc((TACTICS[m.tactic]||TACTICS.bal).note)}${condOf(m).tac && condOf(m).tac[m.tactic] ? (condOf(m).tac[m.tactic]>0 ? ' Suits these conditions.' : ' Risky in these conditions.') : ''}</span></div>`}
    <div class="mgrid">
      <div class="card"><h3>Match stats</h3><div class="tbl"><table><thead><tr><th>${esc(last(m.pl[0].name))}</th><th></th><th class="n">${esc(last(m.pl[1].name))}</th></tr></thead><tbody>${statRows.map(r=>`<tr><td class="mono">${r[1]}</td><td class="muted" style="text-align:center;font-size:13px">${r[0]}</td><td class="n">${r[2]}</td></tr>`).join('')}</tbody></table></div></div>
      <div class="card"><h3>Point by point</h3><div class="log">${m.log.length?m.log.map(l=>`<div>${l.e?`<span class="e">${esc(l.e)}</span>`:''}<span class="${l.u?'u':''}">${esc(l.t)}</span><span class="s">${esc(l.s)}</span></div>`).join(''):'<p class="muted">Press Next point or Auto-play to start.</p>'}</div></div>
    </div>`;
}

function dudesChart(L){
  const series = L.map(d=>({d, h:(d.hist||[]).filter(x=>x[1])})).filter(x=>x.h.length>1);
  if(!series.length) return '<p class="muted">Ranking history appears after a few weeks.</p>';
  const W=680, H=230, pl=46, pr=16, pt=14, pb=28;
  const all = series.flatMap(x=>x.h);
  const maxR = Math.max(...all.map(x=>x[1]));
  const bottom = Math.pow(10, Math.ceil(Math.log10(Math.max(10, maxR))));
  const y = r => pt + Math.log10(r)/Math.log10(bottom)*(H-pt-pb);
  const x0 = Math.min(...all.map(x=>x[0])), x1 = Math.max(...all.map(x=>x[0]));
  const x = a => pl + (a-x0)/Math.max(1,x1-x0)*(W-pl-pr);
  const ticks = [1,10,100,1000,10000].filter(t=>t<=bottom);
  let xl = '';
  for(let yr=state.startYear; yr<=state.season; yr++){ const aw=(yr-state.startYear)*52+1; if(aw>=x0 && aw<=x1) xl += `<line x1="${x(aw)}" x2="${x(aw)}" y1="${pt}" y2="${H-pb}" stroke="var(--line)" stroke-dasharray="3 3"/><text x="${x(aw)+4}" y="${H-10}" fill="var(--muted)" font-size="11" font-family="IBM Plex Mono, monospace">${yr}</text>`; }
  const lines = series.map(({d,h})=>{ const path = h.map((p,i)=>`${i?'L':'M'}${x(p[0]).toFixed(1)},${y(p[1]).toFixed(1)}`).join(''); const lp = h[h.length-1];
    return `<path d="${path}" fill="none" stroke="${DUDE_COLOR[d.key]}" stroke-width="${d.you?3:1.8}" stroke-linejoin="round"/><circle cx="${x(lp[0])}" cy="${y(lp[1])}" r="4" fill="${DUDE_COLOR[d.key]}"/>`; }).join('');
  const legend = series.map(({d,h})=>`<span style="display:inline-flex;align-items:center;gap:6px;margin-right:16px;font-size:13px"><i style="width:14px;height:${d.you?4:3}px;background:${DUDE_COLOR[d.key]};display:inline-block;border-radius:2px"></i>${esc(last(d.name))}${d.you?' (you)':''} · No. ${h[h.length-1][1]}</span>`).join('');
  return `<div style="margin-bottom:6px">${legend}</div><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ranking history of the three Dudes">
    ${ticks.map(t=>`<line x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${pl-8}" y="${y(t)+4}" text-anchor="end" fill="var(--muted)" font-size="11" font-family="IBM Plex Mono, monospace">${t}</text>`).join('')}
    ${xl}${lines}</svg>`;
}

function rankChart(){

  for(let yr=state.startYear; yr<=state.season; yr++){ const aw=(yr-state.startYear)*52+1; if(aw>=x0 && aw<=x1) xl += `<line x1="${x(aw)}" x2="${x(aw)}" y1="${pt}" y2="${H-pb}" stroke="var(--line)" stroke-dasharray="3 3"/><text x="${x(aw)+4}" y="${H-10}" fill="var(--muted)" font-size="11" font-family="IBM Plex Mono, monospace">${yr}</text>`; }

  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ranking over time">
    ${ticks.map(t=>`<line x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${pl-8}" y="${y(t)+4}" text-anchor="end" fill="var(--muted)" font-size="11" font-family="IBM Plex Mono, monospace">${t}</text>`).join('')}

  </svg>`;
}
function careerTiles(){

function legacy(){
  const s = state.player.stats, majors = s.titles.filter(t=>t.tier==='SLAM').length;
  const golds = s.medals.filter(m=>m.medal==='Gold').length;
  if(state.era==='dudes' && majors>0){
    const rivals = state.ai.filter(a=>a.dude).concat(state.legends.filter(l=>l.dude));
    const best = Math.max(0, ...rivals.map(r=>r.majors||0));
    if(majors>best) return 'The greatest Dude';
  }
  if(majors>=15) return 'Greatest of all time';
  if(majors>=8) return 'All-time great';
  if(majors>=3 || s.weeks1>=20 || (majors>=1 && golds>=1)) return 'Hall of Famer';
  if(majors>=1) return 'Grand Slam champion';
  if(golds>=1) return 'Olympic champion';
  if(s.best && s.best<=10) return 'Top-10 player';
  if(s.best && s.best<=50) return 'Tour mainstay';
  if(s.best && s.best<=100) return 'Tour regular';
  if(s.titles.length) return 'Challenger circuit winner';
  return 'Journeyman';
}

      ${(()=>{ const h = state.history[state.history.length-1]; if(!h) return ''; const m = Object.entries(h.majors).map(([c,v])=>`${slamName(c)}: ${esc(v.name)}`).join(' · '); return m?`<p style="font-size:14px">${m}</p>`:''; })()}

function render(){

  if(state.over && !state.recap){ app.innerHTML = renderTop() + renderOver(); renderModal(); return; }
  let v;
  if(ui.tab==='week') v = state.match ? renderMatch() : state.team ? renderTeam() : state.tour ? renderTour() : renderHub();
  else if(ui.tab==='player') v = renderPlayer();
  else if(ui.tab==='sponsors') v = renderSponsors();
  else if(ui.tab==='rank') v = renderRankings();
  else if(ui.tab==='history') v = renderHistory();
  else if(ui.tab==='saves') v = renderSaves();
  else if(ui.tab==='records') v = renderRecords();

/* ---------- events ---------- */
function act(a, v){
  if(state && (state.offcourt || state.press) && ['train','rest','enter','laver','davis','play','quick','dplay','dquick'].includes(a)){ renderModal(); return; }
  const m = state && state.match, d = ui.draft;
  switch(a){
    case 'd-era': d.era=v; render(); break;
    case 'd-dude': d.dude=v; render(); break;
    case 'd-dudeyear': d.dudeYear=+v; render(); break;
    case 'd-style': d.style=v; render(); break;
    case 'd-hand': d.hand=v; render(); break;
    case 'd-bh': d.bh=v; render(); break;
    case 'd-grip': d.grip=v; render(); break;
    case 'd-build': d.build=v; render(); break;
    case 'd-diff': d.diff=v; render(); break;
    case 'd-trait': d.trait=v; render(); break;
    case 'reroll': rollDraft(d); render(); break;
    case 'start': newCareer(d); window.scrollTo(0,0); break;
    case 'tab': stopAuto(); if(v==='saves'){ ui.saveMsg=null; prepExport(); } ui.tab=v; ui.confirmNew=false; ui.confirmRetire=false; ui.confirmDrop=null; render(); window.scrollTo(0,0); break;
    case 'enter': enterEvent(v); window.scrollTo(0,0); break;
    case 'laver': acceptLaver(); window.scrollTo(0,0); break;
    case 'davis': acceptDavis(); window.scrollTo(0,0); break;
    case 'davis-play': startDavisMatch(false); break;
    case 'davis-quick': startDavisMatch(true); break;
    case 'davis-finish': finishDavis(); window.scrollTo(0,0); break;
    case 'laver-play': startTeamMatch(false); break;
    case 'laver-quick': startTeamMatch(true); break;
    case 'laver-finish': finishLaver(); window.scrollTo(0,0); break;
    case 'focus': ui.focus=v; render(); break;
    case 'train': train(ui.focus); window.scrollTo(0,0); break;
    case 'rest': rest(); window.scrollTo(0,0); break;
    case 'dismiss': ui.report=null; render(); break;
    case 'coach': hireCoach(v); break;
    case 'psub': ui.pSub=v; ui.tab='player'; render(); window.scrollTo(0,0); break;
    case 'hsub': ui.histSub=v; render(); break;
    case 'goto-rivals': ui.pSub='rivals'; ui.tab='player'; render(); window.scrollTo(0,0); break;
    case 'press': resolvePress(+v); break;
    case 'replay-intro': stopAuto(); if(state) save(); location.reload(); break;
    case 'show-coaches': ui.showCoaches = v==='1'; render(); break;
    case 'mtactic': if(m && !m.done){ m.tactic=v; ui.tactic=v; updateMatch(); } break;
    case 'dbl-partner': { const D = dblState(), a = AI(v); if(a){ D.partner = v; D.pname = a.name; news(`${state.player.name} picks ${a.name} as his Olympic doubles partner.`, true); } save(); render(); break; }
    case 'dbl-on': dblState().on = v==='1'; save(); render(); break;
    case 'tactic': ui.tactic=v; render(); break;
    case 'play': startMatch(false); break;
    case 'dplay': startDblMatch(false); break;
    case 'dquick': startDblMatch(true); break;
    case 'dwithdraw': withdrawDbl(); break;
    case 'quick': startMatch(true); break;
    case 'withdraw': withdraw(); break;
    case 'pt': if(m){ playPoint(m); updateMatch(); } break;
    case 'auto': toggleAuto(); break;
    case 'game': if(m){ const k=()=>m.sets.length*100+m.g[0]+m.g[1]; const s=k(); while(!m.done && k()===s) playPoint(m); updateMatch(); } break;
    case 'set': if(m){ const s=m.sets.length; while(!m.done && m.sets.length===s) playPoint(m); updateMatch(); } break;
    case 'end': if(m){ stopAuto(); while(!m.done) playPoint(m); updateMatch(); } break;
    case 'continue': finishMatch(); break;
    case 'finish-tour': finishTournament(); window.scrollTo(0,0); break;
    case 'recap-ok': state.recap=null; save(); render(); break;
    case 'rankmode': ui.rankMode=v; render(); break;
    case 'sched-year': ui.schedYear=+v; render(); break;
    case 'sched-all': ui.schedAll = v==='1'; render(); break;
    case 'profile': ui.profile=v; renderModal(); break;
    case 'close-profile': ui.profile=null; renderModal(); break;
    case 'ob-pick': { const [slot, i] = v.split(':'); state.onboard.pick[slot] = i==='none' ? 'none' : +i; renderModal(); break; }
    case 'ob-done': { const O = state.onboard; for(const slot of ['racket','apparel']){ const i = O.pick[slot]; if(i!=='none' && i!==null) signContract(O.offers[slot][i]); } state.onboard = null; save(); render(); break; }
    case 'accept': { const P = state.player, o = P.offers.find(x=>x.id===v); if(!o) break; for(const c of P.contracts.filter(c=>c.slot===o.slot || (o.combo && c.slot==='shoes') || (o.slot==='shoes' && c.combo))) P.money -= buyout(c); signContract(o); save(); render(); break; }
    case 'decline': state.player.offers = state.player.offers.filter(x=>x.id!==v); save(); render(); break;
    case 'drop': ui.confirmDrop=v; render(); break;
    case 'drop-no': ui.confirmDrop=null; render(); break;
    case 'drop-yes': { const P = state.player, c = P.contracts.find(x=>x.slot===v); if(c){ P.money -= buyout(c); P.contracts = P.contracts.filter(x=>x!==c); news(`${P.name} ends the ${c.brand} deal early.`, true); } ui.confirmDrop=null; save(); render(); break; }
    case 'slot-save': ui.confirmSlot={i:+v,a:'save'}; render(); break;
    case 'slot-save-yes': saveToSlot(+v); break;
    case 'slot-load': ui.confirmSlot={i:+v,a:'load'}; render(); break;
    case 'slot-load-yes': loadFromSlot(+v); break;
    case 'slot-del': ui.confirmSlot={i:+v,a:'del'}; render(); break;
    case 'slot-del-yes': { try{ localStorage.removeItem(SLOT_PREFIX+v); }catch(e){} ui.confirmSlot=null; ui.saveMsg=`Deleted slot ${+v+1}.`; render(); break; }
    case 'slot-cancel': ui.confirmSlot=null; render(); break;
    case 'delcareer': ui.confirmDelCareer=true; render(); break;
    case 'delcareer-no': ui.confirmDelCareer=false; render(); break;
    case 'clearslots': ui.confirmClearSlots=true; render(); break;
    case 'clearslots-no': ui.confirmClearSlots=false; render(); break;
    case 'clearslots-yes': { for(let i=0;i<SLOT_COUNT;i++){ try{ localStorage.removeItem(SLOT_PREFIX+i); }catch(e){} } ui.confirmClearSlots=false; ui.saveMsg='All save slots deleted.'; render(); break; }
    case 'msg-x': ui.saveMsg=null; render(); break;
    case 'import-code': { const el = document.getElementById('import-code'); if(el && el.value.trim()) importCode(el.value); break; }
    case 'copy-code': { const el = document.getElementById('export-code'), msg = document.getElementById('copy-msg');
      const fallback = () => { if(el){ el.focus(); el.select(); } if(msg) msg.textContent = 'Copy was blocked. The code is selected, so press Ctrl+C or ⌘C.'; };
      try{ navigator.clipboard.writeText(ui.exportCode).then(()=>{ if(msg) msg.textContent = 'Copied. Paste it somewhere safe.'; }, fallback); }catch(e){ fallback(); }
      break; }
    case 'oc': resolveOffcourt(+v); break;
    case 'life': state.player.life = v; save(); render(); break;
    case 'staff-tier': { const [k,l] = v.split(':'); const P = state.player; P.staff = P.staff || {}; P.staff[k] = +l; save(); render(); break; }
    case 'staff': { const P = state.player; P.staff = P.staff || {}; P.staff[v] = !P.staff[v]; save(); render(); break; }
    case 'retire': ui.confirmRetire=true; render(); break;
    case 'retire-no': ui.confirmRetire=false; render(); break;
    case 'retire-yes': ui.confirmRetire=false; retire(); break;
    case 'new': ui.confirmNew=true; render(); break;
    case 'new-no': ui.confirmNew=false; render(); break;
    case 'new-yes': stopAuto(); ui.confirmNew=false; ui.confirmDelCareer=false; state=null; ui.draft=null; ui.report=null; ui.profile=null; ui.tab='week'; try{ localStorage.removeItem(KEY); }catch(e){} render(); window.scrollTo(0,0); break;
  }
}
document.addEventListener('click', e => {
  if(e.target.id==='modal' && ui.profile && state && !state.recap && !state.onboard){ ui.profile=null; renderModal(); return; }
  const b = e.target.closest('[data-act]'); if(!b || b.disabled) return; act(b.dataset.act, b.dataset.v);
});
document.addEventListener('keydown', e => { if(e.key==='Escape' && ui.profile){ ui.profile=null; renderModal(); } });
document.addEventListener('input', e => { if(e.target.id==='f-name' && ui.draft) ui.draft.name = e.target.value; });
document.addEventListener('change', e => {
  if(e.target.id==='f-country' && ui.draft) ui.draft.country = e.target.value;
  if(e.target.id==='import-file' && e.target.files && e.target.files[0]){ const r = new FileReader(); r.onload = () => importCode(String(r.result||'')); r.readAsText(e.target.files[0]); }
});

/* ---------- boot ---------- */
try{ window.claude?.hot?.snapshot?.(() => ({state, ui:{tab:ui.tab, focus:ui.focus, tactic:ui.tactic, rankMode:ui.rankMode, draft:ui.draft, report:ui.report}})); }catch(e){}
function boot(data){
  if(data && data.state){ state = migrate(data.state); aiMap = null; if(data.ui) Object.assign(ui, data.ui); }
  else load();
  if(state){ for(const a of state.ai) usedNames.add(a.name); if(!state.rankIdx) computeRanks(); }
  render();
}
if(window.claude?.hot?.ready) window.claude.hot.ready(boot); else boot(window.claude?.hot?.data ?? {});
})();
</script>

<script>
if('serviceWorker' in navigator){ window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(()=>{}); }); }
</script>
