
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F3326">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Baseline Tour">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}</style>
<title>Baseline Tour</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EBEFE8; --panel:#FFFFFF; --panel2:#F4F7F2; --ink:#15211B; --muted:#5A695F; --line:#D2DAD0;
  --accent:#1D5A42; --accent-ink:#FFFFFF; --accent-soft:#DCEBE2;
  --board:#0F3326; --board2:#17463A; --board-ink:#E8F0EA; --board-muted:#9DB8A9; --ball:#DCEA4C; --ball-ink:#1B2A10;
  --clay:#B5542D; --grass:#397D43; --hard:#2B62A6; --indoor:#6853A6;
  --good:#23804D; --bad:#B03A31; --warn:#A87B12;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0C1411; --panel:#131D18; --panel2:#18241F; --ink:#E3EAE5; --muted:#93A399; --line:#26352D;
    --accent:#62B68C; --accent-ink:#07130D; --accent-soft:#1B3328;
    --board:#0A281E; --board2:#12392C;
    --clay:#D2744C; --grass:#5DA868; --hard:#5E91D8; --indoor:#9B88D8;
    --good:#4DC080; --bad:#E3685E; --warn:#D9A83E;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0C1411; --panel:#131D18; --panel2:#18241F; --ink:#E3EAE5; --muted:#93A399; --line:#26352D;
  --accent:#62B68C; --accent-ink:#07130D; --accent-soft:#1B3328;
  --board:#0A281E; --board2:#12392C;
  --clay:#D2744C; --grass:#5DA868; --hard:#5E91D8; --indoor:#9B88D8;
  --good:#4DC080; --bad:#E3685E; --warn:#D9A83E;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:800;letter-spacing:.01em;text-wrap:balance;margin:0;line-height:1.05;text-transform:uppercase}
h1{font-size:clamp(34px,6vw,58px)}
h2{font-size:28px}
h3{font-size:21px}
p{margin:0}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:20px 56px}
.stack{display:flex;flex-direction:column;gap:16px}
.between{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}
.card h3{margin-bottom:10px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--board);color:var(--board-ink)}
.topbar .inner{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:10px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.brand i{width:14px;height:14px;border-radius:50%;background:var(--ball);display:inline-block;box-shadow:inset -3px -2px 0 rgba(0,0,0,.18)}
.plate{display:flex;gap:18px;flex-wrap:wrap;margin-left:auto;font-family:var(--mono);font-size:13px}
.plate div{display:flex;flex-direction:column;line-height:1.2}
.plate span{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--board-muted)}
.plate b{font-weight:600;font-variant-numeric:tabular-nums}
.tabs{max-width:1180px;margin:0 auto;padding-inline:16px;display:flex;gap:4px;overflow-x:auto}
.tab{background:none;border:0;color:var(--board-muted);padding:8px 12px 10px;cursor:pointer;font-weight:600;font-size:14px;border-bottom:3px solid transparent;white-space:nowrap}
.tab.on{color:var(--board-ink);border-bottom-color:var(--ball)}
.tab:hover{color:var(--board-ink)}

/* buttons */
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.big{padding:13px 20px;font-size:16px;width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.danger{color:var(--bad)}

/* create */
.create .intro{max-width:760px;padding-block:18px 26px}
.create .intro h1{margin-block:8px 12px}
.lede{font-size:17px;color:var(--muted);max-width:62ch}
.create-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;align-items:start}
label{display:block;font-size:12px;font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-block:14px 6px}
label:first-child{margin-top:0}
input[type=text],select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel2)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--panel2);padding:10px;cursor:pointer;font-weight:600}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.styles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.style{text-align:left;border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.style b{font-family:var(--display);text-transform:uppercase;font-size:19px;letter-spacing:.02em}
.style span{font-size:13px;color:var(--muted)}
.style.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.ovrline{font-family:var(--mono);font-size:13px;color:var(--muted);margin-bottom:12px}
.ovrline b{color:var(--ink);font-size:15px}

/* attribute bars */
.attrs{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.attr{display:grid;grid-template-columns:86px 1fr 38px;align-items:center;gap:10px;font-size:13px}
.attr .v{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.track{position:relative;height:8px;border-radius:4px;background:var(--panel2);border:1px solid var(--line)}
.fill{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--accent)}
.pot{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.55}
.legend{font-size:12px;color:var(--muted);display:flex;gap:14px;align-items:center}
.legend i{display:inline-block;width:2px;height:12px;background:var(--ink);opacity:.55;vertical-align:middle;margin-right:5px}

/* hub */
.hub{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:20px;align-items:start}
.weekhead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.weekhead h2{font-size:clamp(30px,5vw,44px)}
.status{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.stat .k{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.stat .val{font-family:var(--display);font-size:26px;font-weight:700;line-height:1}
.meter{height:6px;border-radius:3px;background:var(--panel2);border:1px solid var(--line);position:relative;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;border-radius:3px}
.form{display:flex;gap:4px;flex-wrap:wrap}
.form span{width:22px;height:22px;border-radius:5px;display:grid;place-items:center;font-family:var(--mono);font-size:11px;font-weight:600;color:#fff}
.form .W{background:var(--good)}.form .L{background:var(--bad)}
.form .none{color:var(--muted);font-size:13px;width:auto}
.evs{display:flex;flex-direction:column;gap:10px}
.ev{display:grid;grid-template-columns:78px minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;border-left:5px solid var(--sc)}
.tierbadge{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:22px;line-height:1;color:var(--sc)}
.tierbadge small{display:block;font-family:var(--mono);font-weight:500;font-size:10px;letter-spacing:.1em;color:var(--muted);margin-top:4px}
.ev .name{font-weight:700;font-size:16px}
.ev .meta{font-size:13px;color:var(--muted)}
.ev .right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.pill{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:99px;border:1px solid var(--line);white-space:nowrap}
.pill.main{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.pill.qual{color:var(--warn);border-color:var(--warn)}
.pill.no{color:var(--muted)}
.surf{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.surf i{width:9px;height:9px;border-radius:50%;background:var(--sc)}
.s-hard{--sc:var(--hard)}.s-clay{--sc:var(--clay)}.s-grass{--sc:var(--grass)}.s-indoor{--sc:var(--indoor)}
.offtour{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-block:8px 12px}
.chip{border:1px solid var(--line);background:var(--panel2);border-radius:99px;padding:5px 11px;font-size:13px;cursor:pointer;font-weight:500}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.upc{display:flex;flex-direction:column}
.upc div{display:grid;grid-template-columns:44px 1fr;gap:10px;padding-block:7px;border-bottom:1px solid var(--line);font-size:14px}
.upc div:last-child{border-bottom:0}
.upc .wk{font-family:var(--mono);color:var(--muted);font-size:12px;padding-top:2px}
.upc .e{display:flex;flex-wrap:wrap;gap:4px 12px}
.news{display:flex;flex-direction:column;gap:9px;font-size:14px}
.news div{display:grid;grid-template-columns:62px 1fr;gap:8px}
.news .when{font-family:var(--mono);font-size:11px;color:var(--muted);padding-top:3px}
.news .you{font-weight:600}
.report{border-left:5px solid var(--ball);display:flex;flex-direction:column;gap:6px}
.report ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:2px;font-size:14px}
.pos{color:var(--good)}.neg{color:var(--bad)}

/* tournament */
.band{background:var(--board);color:var(--board-ink);border-radius:12px;padding:18px 20px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-end;border-bottom:6px solid var(--sc)}
.band h2{font-size:clamp(28px,5vw,42px)}
.band .eyebrow{color:var(--board-muted)}
.band .facts{font-family:var(--mono);font-size:12px;color:var(--board-muted);display:flex;gap:14px;flex-wrap:wrap}
.tourgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:start}
.opp{display:flex;flex-direction:column;gap:14px}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
.vs .side{display:flex;flex-direction:column;gap:2px}
.vs .side.r{text-align:right}
.vs .nm{font-family:var(--display);text-transform:uppercase;font-weight:800;font-size:24px;line-height:1}
.vs .sub{font-size:12px;color:var(--muted);font-family:var(--mono)}
.vs .mid{font-family:var(--display);font-size:20px;color:var(--muted)}
.cmp{display:flex;flex-direction:column;gap:6px}
.cmprow{display:grid;grid-template-columns:32px 1fr 80px 1fr 32px;gap:8px;align-items:center;font-size:12px}
.cmprow .l{font-family:var(--mono);text-align:right}
.cmprow .rr{font-family:var(--mono)}
.cmprow .lab{text-align:center;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.half{height:7px;background:var(--panel2);border-radius:4px;position:relative;overflow:hidden}
.half i{position:absolute;top:0;bottom:0;border-radius:4px}
.half.left i{right:0;background:var(--accent)}
.half.right i{left:0;background:var(--muted)}
.tactics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tactic{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:10px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.tactic b{font-size:14px}
.tactic span{font-size:12px;color:var(--muted)}
.tactic.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.path{display:flex;flex-direction:column}
.path div{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding-block:9px;border-bottom:1px solid var(--line);font-size:14px}
.path div:last-child{border-bottom:0}
.path .rd{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);grid-column:1/-1}
.path .sc{font-family:var(--mono);font-variant-numeric:tabular-nums}
.res{font-weight:700}
.res.W{color:var(--good)}.res.L{color:var(--bad)}
.outcome{display:flex;flex-direction:column;gap:12px}
.outcome .big{font-family:var(--display);font-size:40px;font-weight:800;text-transform:uppercase;line-height:1}
.nums{display:flex;gap:26px;flex-wrap:wrap}
.nums div{display:flex;flex-direction:column}
.nums span{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.nums b{font-family:var(--display);font-size:28px}

/* scoreboard */
.board{background:var(--board);color:var(--board-ink);border-radius:12px;padding:14px 16px;border:3px solid var(--board2)}
.board .top{display:flex;justify-content:space-between;gap:10px;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--board-muted);margin-bottom:8px;flex-wrap:wrap}
.brow{display:grid;grid-template-columns:18px minmax(0,1fr) auto 58px;gap:10px;align-items:center;padding-block:8px;border-top:1px solid var(--board2)}
.brow:first-of-type{border-top:0}
.srv{display:grid;place-items:center}
.ball{width:11px;height:11px;border-radius:50%;background:var(--ball);display:block;box-shadow:inset -2px -2px 0 rgba(0,0,0,.2)}
.bname{font-family:var(--display);font-weight:700;font-size:clamp(18px,3.4vw,26px);text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow.winner .bname{color:var(--ball)}
.bsets{display:flex;gap:4px}
.bsets .sc{width:clamp(26px,5vw,36px);text-align:center;font-family:var(--display);font-weight:700;font-size:clamp(22px,4vw,30px);color:var(--board-muted);position:relative}
.bsets .sc.won{color:var(--board-ink)}
.bsets .sc.cur{color:var(--ball)}
.bsets sup{font-size:11px;position:absolute;top:-2px;right:-3px;font-family:var(--mono)}
.pt{background:var(--ball);color:var(--ball-ink);font-family:var(--display);font-weight:800;font-size:clamp(22px,4vw,30px);text-align:center;border-radius:6px;padding-block:1px;min-height:38px;display:grid;place-items:center}
.pt.empty{background:transparent}
.flashline{margin-top:10px;font-family:var(--mono);font-size:13px;color:var(--ball);min-height:20px}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;margin-block:14px}
.mgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:20px;align-items:start}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500;text-align:left;padding:8px 8px;border-bottom:1px solid var(--line)}
td{padding:7px 8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
td.n,th.n{text-align:right;font-family:var(--mono)}
tr.me td{background:var(--accent-soft);font-weight:700}
.tbl{overflow-x:auto}
.log{display:flex;flex-direction:column;max-height:430px;overflow-y:auto}
.log div{display:grid;grid-template-columns:1fr auto;gap:10px;padding-block:6px;border-bottom:1px solid var(--line);font-size:13.5px}
.log .s{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.log .e{grid-column:1/-1;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600}
.log .u{color:var(--good)}

/* career */
.tiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.chart svg{width:100%;height:auto;display:block}
.coaches{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.coach{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--panel2)}
.coach.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.coach b{font-size:15px}
.coach .mono{font-size:12px;color:var(--muted)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.confirm{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px}

/* modal */
#modal{position:fixed;inset:0;background:rgba(6,16,11,.62);z-index:20;display:grid;place-items:center;padding:16px}
#modal[hidden]{display:none}
#modal .card{max-width:520px;width:100%;display:flex;flex-direction:column;gap:14px}

@media (max-width:900px){
  .hub,.tourgrid,.mgrid,.create-grid,.two{grid-template-columns:1fr}
  .tiles{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:560px){
  .status{grid-template-columns:1fr 1fr}
  .offtour,.styles,.coaches{grid-template-columns:1fr}
  .ev{grid-template-columns:1fr;gap:8px}
  .ev .right{flex-direction:row;align-items:center;justify-content:space-between}
  .tactics{grid-template-columns:1fr}
  .plate{margin-left:0;gap:14px}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cmprow{grid-template-columns:28px 1fr 64px 1fr 28px}
}
/* v2 additions */
.replaybtn{margin-left:12px;background:transparent;border:1px solid rgba(255,255,255,.35);color:var(--board-ink);border-radius:99px;padding:3px 10px;font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;vertical-align:middle;white-space:nowrap}
.replaybtn:hover{border-color:var(--ball);color:var(--ball)}
.clash{background:var(--board);color:var(--board-ink);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.clash .ct{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ball);font-weight:600}
.clash .cg{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px}
.clash .cn{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:24px;line-height:1.05;overflow-wrap:anywhere}
.clash .cg > div:last-child{text-align:right}
.clash .vsb{font-family:var(--display);font-weight:800;font-size:30px;color:var(--ball)}
.clash .tape{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:4px 12px;font-family:var(--mono);font-size:12.5px}

    sq.setAttribute('transform', `scale(${(1+(1-sy)*.8).toFixed(3)} ${sy.toFixed(3)})`);

    if(mode !== 'idle') return;
    mode = 'show'; el.classList.add('playing'); t0 = performance.now();
    if(audio){ try{ audio.currentTime = 0; const pr = audio.play(); if(pr && pr.catch) pr.catch(()=>{}); }catch(e){} }
  }
  function wipe(){
    const w = document.getElementById('bt-wipe'); if(!w){ close(); return; }
    done = true; el.style.transition = 'none'; el.style.cursor = 'default';
    const vw = window.innerWidth, vh = window.innerHeight, H = vh*1.12, W = H*300/690;
    w.style.display = 'block'; w.style.width = W+'px'; w.style.height = H+'px'; w.style.top = (-vh*.06)+'px';
    const t0w = performance.now(), D = 950, ease = x => x<.5 ? 4*x*x*x : 1-Math.pow(-2*x+2,3)/2;
    (function step(now){
      const u = Math.min(1, (now - t0w)/D), e = ease(u);
      const left = vw - e*(vw + W), edge = Math.max(0, Math.min(vw, left + W*.5));
      w.style.transform = `translateX(${left}px) skewX(${(-8*Math.sin(u*Math.PI)).toFixed(2)}deg)`;
      el.style.clipPath = el.style.webkitClipPath = `inset(0 ${vw-edge}px 0 0)`;
      if(u < 1) requestAnimationFrame(step); else { el.remove(); w.remove(); }
    })(t0w);
  }
  function close(){
    if(done) return; done = true; el.classList.add('gone');
    if(audio){ const fade = setInterval(()=>{ try{ audio.volume = Math.max(0, audio.volume-.1); if(audio.volume<=.05){ audio.pause(); clearInterval(fade); } }catch(e){ clearInterval(fade); } }, 60); }
    setTimeout(()=>{ el.remove(); }, 700);
  }
  el.addEventListener('click', e => {
    if(e.target.closest('.bt-skip')){ close(); return; }
    if(e.target.closest('.bt-play') || cardShown){ wipe(); return; }
    start();
  });
})();

function weekEvents(week, year){
  if(week>50 && !(year<=1985 && week===48)) return [];
  let rows = TOUR.filter(t => t[0]===week);
  rows = rows.map(t => {
    let [w,city,tier,surf,wk] = t;
    if(city==='Melbourne'){ if(year<=1986) return null; if(year<1988) surf='grass'; }
    if(tier==='FIN') city = finalsCity(year);
    if(city==='Madrid' && year<2002) city='Hamburg';
    if(city==='Hamburg' && tier==='A500' && year<2009) city='Kitzbühel';
    if(city==='Shanghai' && year<2009){ city = year<2002 ? 'Stuttgart' : 'Madrid'; surf='indoor'; }
    return [w,city,tier,surf,wk];
  }).filter(Boolean);
  if(week===48 && year<=1985) rows.push([48,'Melbourne','SLAM','grass',2]);
  const oly = olympicsIn(year);
  if(week===31 && oly) rows.push([31, oly[0], 'OLY', oly[1], 1]);
  if(week===30) rows.push([30, 'IQ', 'IQ', 'hard', 1]);
  const evs = rows.map((t,i) => ({id:`y${year}w${week}t${i}`, city:t[1], tier:t[2], surface:t[3], weeks:t[4]||1, noPts: t[2]==='OLY' && !(year>=2000 && year<=2016)}));
  if(week>50) return evs;
  const clay = (week>=14&&week<=23)||(week>=29&&week<=30);
  const chS = clay ? 'clay' : (week>=24&&week<=28) ? 'grass' : ((week>=42||week<=5) && week%2) ? 'indoor' : 'hard';
  evs.push({id:`y${year}w${week}c`, city:CH_CITIES[(week*7+year)%CH_CITIES.length], tier:'CH', surface:chS, weeks:1});
  evs.push({id:`y${year}w${week}f`, city:ITF_CITIES[(week*5+year)%ITF_CITIES.length], tier:'ITF', surface: clay ? 'clay' : 'hard', weeks:1});
  return evs;
}

const DUDE_YEARS = [[1980,'Borg & McEnroe'],[1990,'Sampras & Agassi'],[2004,'The Big Three'],[2012,'The Big Four'],[2022,'Alcaraz & Sinner'],[2026,'Today']];
function newDraft(){ return rollDraft({name:'Alex Tremblay', country:'CAN', style:'ab', hand:'R', bh:'two', grip:'semi', build:'avg', trait:'clutch', diff:'pro', era:'20s', dude:'lambros', dudeYear:2026}); }
function rollDraft(d){ d.seedAttrs = makeAttrs(56, 'b', 3); d.potRoll = {}; for(const [k] of ATTRS) d.potRoll[k] = rnd(20,34); return d; }
function draftAttrs(d){
  if(d.era==='dudes') return dudeStart(DUDES[d.dude].attrs);
  const a = {};
  for(const [k] of ATTRS) a[k] = d.seedAttrs[k] + STYLES[d.style].off[k] - STYLES.b.off[k];
  for(const m of [BACKHANDS[d.bh].mod, GRIPS[d.grip].mod, BUILDS[d.build].mod]) for(const k in m) a[k] += m[k];
  if(d.hand==='L'){ a.srv += 2; a.bh -= 1; }
  for(const [k] of ATTRS) a[k] = clamp(a[k], 30, 80);
  return a;
}
function draftPot(d){
  const a = draftAttrs(d), p = {};
  if(d.era==='dudes'){ const t = DUDES[d.dude].attrs; for(const [k] of ATTRS) p[k] = Math.min(99, t[k] + DIFFS[d.diff].pot*.5); return p; }
  for(const [k] of ATTRS) p[k] = clamp(a[k] + d.potRoll[k] + STYLES[d.style].off[k]*.5 + DIFFS[d.diff].pot, a[k]+8, 97);
  return p;
}
function buildPool(y){
  const ai = [];
  for(const r of ROSTER){ if(activeIn(r, y)) ai.push(makeReal(r, y)); }
  while(ai.length < 300) ai.push(makeFictional(y, rnd(52,64), ri(18,32)));
  return ai;
}
function makeReal(r, y){
  const lvl = lvlFor(r, y);
  return {id:'r'+r.i, name:r.n, country:r.c, born:r.b, hand:r.h, style:r.s, attrs:makeAttrs(lvl, r.s, 3.5, r.h), real:{pk:r.pk, fr:r.fr, to:r.to, i:r.i}, results:[], inj:0, busy:-99, titles:0, majors:0};
}
function makeFictional(y, rating, age){
  const style = pick(Object.keys(STYLES)), hand = (R()<.12?'L':'R')+(R()<.2?'1':'2');
  return {id:'g'+Math.floor(R()*1e9).toString(36), name:genName(), country:pick(COUNTRIES)[0], born:y-age, hand, style, attrs:makeAttrs(rating, style, 4, hand), pot: age<24 ? Math.min(92, rating+rnd(4,22)) : rating, results:[], inj:0, busy:-99, titles:0, majors:0};
}
function makeDudeAI(key, y){

/* ---------- sponsors ---------- */
function fame(){
  const P = state.player, rk = rankOf('you'), best = P.stats.best;
  const sc = r => r ? clamp(100 - 22*Math.log10(r), 0, 100) : 0;
  const majors = P.stats.titles.filter(t=>t.tier==='SLAM').length;
  const golds = P.stats.medals.filter(m=>m.medal==='Gold' && !m.dbl).length;
  const tour = P.stats.titles.filter(t=>TIERS[t.tier].rank>=4).length;
  return clamp(Math.max(sc(rk), sc(best)*.85) + majors*3 + golds*3 + tour*.3 + (P.trait==='crowd'?6:0) + (P.fameBonus||0) + (LIFESTYLES[P.life||'std'].fame||0) + (P.foundation?4:0) + (hasPers('star')?5:0), 0, 100);
}
const fameTier = f => f>=82?5:f>=70?4:f>=56?3:f>=45?2:1;
function makeComboOffer(tier, kind='normal'){
  const y = state.season, taken = new Set((state.player.contracts||[]).filter(c=>c.slot!=='apparel'&&c.slot!=='shoes').map(c=>c.brand));
  const list = BRANDS.apparel[tier].filter(b=>COMBO_BRANDS.has(b[0]) && y>=b[1] && y<=b[2] && !taken.has(b[0]));
  if(!list.length) return null;
  const o = makeOffer('apparel', tier, true, kind);
  o.brand = pick(list)[0]; o.combo = true;
  const k = 1.9; o.weekly = Math.round(o.weekly*k); o.sign = Math.round(o.sign*k); o.title = Math.round(o.title*k); o.major = Math.round(o.major*k);
  if(kind==='normal') o.years = ri(3,6);
  return o;
}
function makeOffer(slot, tier, lucky=false, kind='normal'){
  tier = clamp(tier, minTier(slot), 5);
  let weekly = TIER_W[tier]*SLOT_M[slot]*rnd(.85,1.2), raise = 0, years, sign = ri(6,14);
  if(kind==='long'){ years = ri(10,15); weekly *= rnd(.85,.95); raise = +rnd(.04,.06).toFixed(3); sign *= 2; }
  else if(kind==='life'){ years = 0; weekly *= rnd(1.05,1.2); raise = .03; sign *= 4; }
  else years = tier>=4 ? ri(2,5) : ri(1,3);
  weekly = Math.round(weekly);
  return {id:Math.floor(R()*1e9).toString(36), slot, tier, brand:brandFor(slot, tier), weekly, years, raise, kind, sign:Math.round(weekly*sign), title:Math.round(weekly*4), major:Math.round(weekly*20), lucky: lucky || kind!=='normal', exp: state ? state.absWeek+12 : 12};
}
function prodigy(){ const P = state.player, rk = rankOf('you'), a = ageOf(P); return !!rk && ((a<=20 && rk<=100) || (a<=22 && rk<=10)); }
const termText = o => o.kind==='life' ? 'a lifetime deal' : `${o.years} year${o.years>1?'s':''}`;
const COMBO_BRANDS = new Set(['Nike','Adidas','Asics','On','Fila','Lacoste','Diadora','Le Coq Sportif','Lotto']);
const comboTag = o => o.combo ? '<span class="tag gold">Head-to-toe</span>' : '';
const kindTag = o => o.kind==='life' ? '<span class="tag gold">Lifetime</span>' : o.kind==='long' ? '<span class="tag gold">Long-term</span>' : '';
function startOffers(isDude, hyped=false){
  const offers = {racket:[], apparel:[]};
  for(const slot of ['racket','apparel']){
    if(isDude){ offers[slot] = [makeOffer(slot,4), makeOffer(slot,5), makeOffer(slot,5,false,'long')]; if(R()<.05) offers[slot].push(makeOffer(slot,5,true,'life')); continue; }
    offers[slot] = [makeOffer(slot,1), makeOffer(slot,1), makeOffer(slot,2)];
    if(R()<(hyped?.05:.01)){ offers[slot].push(makeOffer(slot,4,true,'life')); continue; }
    const roll = R();
    if(roll<(hyped?.2:.01)) offers[slot].push(makeOffer(slot,3,true,'long'));
    else if(roll<.03) offers[slot].push(makeOffer(slot,4,true));
    else if(roll<.09) offers[slot].push(makeOffer(slot,3,true));
  }
  return {offers, pick:{racket:null, apparel:null}};
}
function genOffers(reason, opts={}){
  const P = state.player, f = fame(), t = fameTier(f), prod = prodigy(), rk = rankOf('you')||9999;
  P.offers = P.offers.filter(o=>o.exp>state.absWeek);
  let made = 0;
  for(const [slot] of SLOTS){
    if(minTier(slot)>t) continue;
    if(slot==='shoes' && P.contracts.some(c=>c.combo)) continue;
    const cur = P.contracts.find(c=>c.slot===slot);
    const n = cur && cur.tier>=t ? (R()<.35?1:0) : ri(1,2);
    for(let i=0;i<n;i++){
      let tier = t - (R()<.45?1:0);
      if(R()<.12) tier++;
      tier = clamp(tier, 1, 5);
      if(cur && tier<=cur.tier && R()<.6) continue;
      let kind = 'normal';
      if(tier>=4 && (f>=88 || prod) && R()<.25) kind = 'long';
      if(tier>=5 && t>=5 && R()<.12) kind = 'life';
      if(slot==='apparel' && tier>=3 && R() < (tier>=4?.45:.3)){ const co = makeComboOffer(tier, kind); if(co){ P.offers.push(co); made++; continue; } }
      P.offers.push(makeOffer(slot, tier, false, kind)); made++;
    }
  }
  if(P.staff && P.staff.agent && R()<.5){ const sl = pick(SLOTS.filter(x=>minTier(x[0])<=t))[0]; P.offers.push(makeOffer(sl, t)); made++; }
  if(opts.prodigy){ P.offers.push(makeOffer(pick(['racket','apparel','shoes']), clamp(t+1,3,5), true, 'long')); made++; }
  const bySlot = {};
  P.offers.sort((a,b)=>b.tier-a.tier || b.weekly-a.weekly);
  P.offers = P.offers.filter(o => (bySlot[o.slot] = (bySlot[o.slot]||0)+1) <= 2).slice(0,8);
  made = Math.min(made, P.offers.length);
  if(made) news(`Your agent has ${made} new sponsorship offer${made>1?'s':''}${reason?' after '+reason:''}.`, true);
  return made;
}
function signContract(o){
  const P = state.player;
  if(P.contracts.some(c=>c.slot!==o.slot && c.brand===o.brand)){ news(`${o.brand} already sponsors you in another category.`, true); P.offers = P.offers.filter(x=>x.id!==o.id); return; }
  P.contracts = P.contracts.filter(c=>c.slot!==o.slot && !(o.combo && c.slot==='shoes') && !(o.slot==='shoes' && c.combo));
  const end = o.kind==='life' ? 9999 : state.season + o.years - 1;
  P.contracts.push({combo:!!o.combo, slot:o.slot, brand:o.brand, tier:o.tier, weekly:o.weekly, title:o.title, major:o.major, end, raise:o.raise||0, kind:o.kind||'normal', since:state.season});
  const bonus = o.sign*ms()*(P.trait==='crowd'?1.6:1);
  P.money += bonus; P.stats.endorse += bonus;
  P.offers = P.offers.filter(x=>x.id!==o.id && x.slot!==o.slot);
  news(o.kind==='life' ? `${P.name} signs a lifetime deal with ${o.brand}.` : `${P.name} signs with ${o.brand} (${SLOTS.find(s=>s[0]===o.slot)[1].toLowerCase()}) through ${end}${o.kind==='long'?', a '+o.years+'-year deal':''}.`, true);
}
const buyout = c => c.weekly*ms()*(c.kind==='life'?52:c.kind==='long'?26:8);
function gear(P){
  const g = {srv:0,fh:0,bh:0,spd:0};
  const r = (P.contracts||[]).find(c=>c.slot==='racket'), s = (P.contracts||[]).find(c=>c.slot==='shoes');
  if(r){ const b=(r.tier-1)*.4; g.srv+=b; g.fh+=b; g.bh+=b; }
  if(s){ g.spd += (s.tier-1)*.3; }
  const ap = (P.contracts||[]).find(c=>c.combo); if(ap && !s){ g.spd += (ap.tier-1)*.3; }
  return g;
}
function endorseWeekly(){ const P = state.player; return (P.contracts||[]).reduce((s,c)=>s+c.weekly,0)*ms()*(P.trait==='crowd'?1.6:1)*(P.staff&&P.staff.agent?1.2*.9:1); }
function payBonus(kind){
  const P = state.player; let tot = 0;
  for(const c of P.contracts) tot += (kind==='major'?c.major:c.title);
  tot *= ms()*(P.trait==='crowd'?1.6:1);
  if(tot>0){ P.money += tot; P.stats.endorse += tot; }
  return tot;
}
function checkMilestones(){
  const P = state.player, rk = rankOf('you');
  if(!P.milestones.prodigy && prodigy()){ P.milestones.prodigy = true; genOffers('being called the next big thing at '+ageOf(P), {prodigy:true}); return; }
  for(const m of [200,100,50,20,10,5,1]){
    if(rk && rk<=m && !P.milestones['r'+m]){ for(const n of [200,100,50,20,10,5,1]) if(n>=m) P.milestones['r'+n]=true; genOffers(`reaching ${m===1?'No. 1':'the top '+m}`); break; }
  }
}

/* ---------- save slots ---------- */
const SLOT_COUNT = 6, SLOT_PREFIX = 'baseline-tour-slot-';
function b64enc(u8){ let s=''; for(let i=0;i<u8.length;i+=0x8000) s += String.fromCharCode.apply(null, u8.subarray(i,i+0x8000)); return btoa(s); }
function b64dec(str){ const bin = atob(str.replace(/\s+/g,'')); const u = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u; }
async function pack(obj){
  const json = JSON.stringify(obj);
  try{ if(window.CompressionStream){ const st = new Blob([json]).stream().pipeThrough(new CompressionStream('gzip')); return 'BT1gz:'+b64enc(new Uint8Array(await new Response(st).arrayBuffer())); } }catch(e){}
  return 'BT1js:'+json;
}
async function unpack(str){
  str = String(str||'').trim();
  if(str.startsWith('BT1gz:')){ const st = new Blob([b64dec(str.slice(6))]).stream().pipeThrough(new DecompressionStream('gzip')); return JSON.parse(await new Response(st).text()); }
  if(str.startsWith('BT1js:')) return JSON.parse(str.slice(6));
  return JSON.parse(str);
}
function slotMeta(i){ try{ const raw = localStorage.getItem(SLOT_PREFIX+i); return raw ? (JSON.parse(raw).meta || null) : null; }catch(e){ return null; } }
function anySlots(){ for(let i=0;i<SLOT_COUNT;i++) if(slotMeta(i)) return true; return false; }
function metaOf(s){ return {name:s.player.name, era:eraOf(s.era).name, season:s.season, week:s.week, rank:(s.rankIdx&&s.rankIdx.you)||null, slams:s.player.stats.titles.filter(t=>t.tier==='SLAM').length, age:s.season-s.player.born, at:new Date().toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}; }
async function saveToSlot(i){
  try{ const data = await pack(state); localStorage.setItem(SLOT_PREFIX+i, JSON.stringify({meta:metaOf(state), data})); ui.saveMsg = `Saved to slot ${i+1}.`; }
  catch(e){ ui.saveMsg = 'Could not save here. This browser may be out of storage or blocking saves. Use a save code instead.'; }
  ui.confirmSlot = null; render();
}
async function loadState(obj){
  const s = migrate(obj);
  if(!s || !s.player || !s.ai) throw new Error('bad save');
  stopAuto(); state = s; aiMap = null;
  for(const a of state.ai) usedNames.add(a.name);
  if(!state.rankIdx) computeRanks();
  ui.tab='week'; ui.report=null; ui.profile=null; ui.exportCode=null; ui.confirmSlot=null;
  save(); render(); window.scrollTo(0,0);
}
async function loadFromSlot(i){
  try{ const o = JSON.parse(localStorage.getItem(SLOT_PREFIX+i)); await loadState(await unpack(o.data)); ui.saveMsg = `Loaded slot ${i+1}.`; }
  catch(e){ ui.saveMsg = 'That save could not be read.'; ui.confirmSlot=null; render(); }
}
async function importCode(code){
  try{ await loadState(await unpack(code)); ui.saveMsg = 'Save code loaded.'; }
  catch(e){ ui.saveMsg = 'That save code could not be read. Check that you copied all of it.'; render(); }
}
async function prepExport(){ ui.exportCode = null; try{ ui.exportCode = await pack(state); }catch(e){ ui.exportCode = ''; } if(ui.tab==='saves') render(); }
function slotRows(inGame){
  return [...Array(SLOT_COUNT)].map((_,i)=>{
    const m = slotMeta(i), c = ui.confirmSlot && ui.confirmSlot.i===i ? ui.confirmSlot.a : null;
    let btns;
    if(c==='save') btns = `<div class="confirm"><span>Overwrite?</span><button class="btn danger sm" data-act="slot-save-yes" data-v="${i}">Overwrite</button><button class="btn sm" data-act="slot-cancel">Cancel</button></div>`;
    else if(c==='load') btns = `<div class="confirm"><span>Your current career is only kept if it is saved in a slot.</span><button class="btn primary sm" data-act="slot-load-yes" data-v="${i}">Load</button><button class="btn sm" data-act="slot-cancel">Cancel</button></div>`;
    else if(c==='del') btns = `<div class="confirm"><span>Delete this save?</span><button class="btn danger sm" data-act="slot-del-yes" data-v="${i}">Delete</button><button class="btn sm" data-act="slot-cancel">Cancel</button></div>`;
    else btns = `<div class="actions">${inGame?`<button class="btn ${m?'':'primary'} sm" data-act="${m?'slot-save':'slot-save-yes'}" data-v="${i}">Save here</button>`:''}${m?`<button class="btn ${inGame?'':'primary'} sm" data-act="${inGame?'slot-load':'slot-load-yes'}" data-v="${i}">Load</button><button class="btn sm danger" data-act="slot-del" data-v="${i}">Delete</button>`:''}</div>`;

/* ---------- rankings ---------- */
function computeRanks(){
  const cut = state.absWeek - 52, list = [];
  for(const p of [...state.ai, state.player]){
    let s=0; for(const r of p.results) if(r.aw>cut) s+=r.pts;
    if(s>0) list.push([p.id, s]);
  }
  list.sort((a,b)=>b[1]-a[1]);
  state.rankList = list.map(x=>x[0]);
  state.rankPts = Object.fromEntries(list);
  state.rankIdx = Object.fromEntries(list.map((x,i)=>[x[0], i+1]));
  const up = state.rankPts.you || 0;
  if(up>0){ const virt = Math.round(Math.pow(76800/up, 0.949)); if(virt>150) state.rankIdx.you = Math.max(state.rankIdx.you, virt); }
}
function recordRank(){
  const P = state.player, rk = rankOf('you');
  P.rankHist.push([state.absWeek, rk]);
  if(rk && (!P.stats.best || rk < P.stats.best)) P.stats.best = rk;
  if(rk===1) P.stats.weeks1++;
  if(state.era==='dudes'){ state.dudeHist = state.dudeHist || {}; for(const a of state.ai){ if(a.dude) (state.dudeHist[a.id] = state.dudeHist[a.id] || []).push([state.absWeek, rankOf(a.id)]); } }
  const top = state.rankList[0]; if(top){ const w = state.wk1[top] || (state.wk1[top] = {n:0, name:getP(top)?.name}); w.n++; }
}

/* ---------- weekly plan & AI sim ---------- */
function laverTeams(){
  const eu=[], world=[];
  for(const id of state.rankList){
    const p = getP(id); if(!p) continue;
    if(id==='you' ? state.player.injured>0 : p.inj>0) continue;
    const team = EUROPE.has(p.country) ? eu : world;
    if(team.length<6) team.push(id);
    if(eu.length>=6 && world.length>=6) break;
  }
  return {eu, world};
}
function planWeek(){
  const evs = weekEvents(state.week, state.season);
  const plan = {}; evs.forEach(e => plan[e.id]=[]);
  const order = evs.slice().sort((a,b)=>TIERS[b.tier].rank - TIERS[a.tier].rank);
  const assigned = new Set();
  state.laverPlan = null;
  const lc = state.week===LAVER_WEEK ? laverCity(state.season) : null;
  if(lc){
    const teams = laverTeams();
    state.laverPlan = {city:lc, ...teams, invited: teams.eu.includes('you') || teams.world.includes('you'), played:false};
    for(const id of [...teams.eu, ...teams.world]) if(id!=='you') assigned.add(id);
  }
  if(!state.davis || state.davis.year!==state.season) initDavis();
  if(!state.offcourt && !state.over){ if(state.nextOC==null) state.nextOC = state.absWeek + ri(4,8); if(state.absWeek>=state.nextOC){ state.offcourt = genOffcourt(); state.nextOC = state.absWeek + ri(6,11); } }
  state.davisPlan = null;
  const D = state.davis;
  if(D && !D.winner && state.week===DAVIS_WEEKS[D.round]){
    const ties = [];
    for(let i=0;i<D.alive.length;i+=2){
      const a = D.alive[i], b = D.alive[i+1];
      const pa = nationPlayers(a, assigned), pb = nationPlayers(b, assigned);
      pa.concat(pb).forEach(id=>{ if(id!=='you') assigned.add(id); });
      ties.push({a, b, pa, pb, surface:pick(['hard','clay','indoor','indoor'])});
    }
    const ut = ties.findIndex(t=>t.pa.includes('you')||t.pb.includes('you'));
    state.davisPlan = {round:D.round, ties, userTie:ut, played:false};
  }
  const iq = evs.find(e=>e.tier==='IQ');
  if(iq){ for(const id of state.rankList){ if(plan[iq.id].length>=63) break; if(id==='you' || assigned.has(id)) continue; const a = AI(id); if(!a || a.inj>0) continue; if((rankOf(id)||9999)>64) break; plan[iq.id].push(id); assigned.add(id); } }
  const fin = evs.find(e=>e.tier==='FIN');
  if(fin){ for(const id of state.rankList.slice(0,8)){ if(id!=='you'){ plan[fin.id].push(id); assigned.add(id); } } }
  const oly = evs.find(e=>e.tier==='OLY');
  if(oly){
    const per = {};
    per[state.player.country] = (rankOf('you')||9999) <= 60 ? 1 : 0;
    for(const id of state.rankList){
      if(id==='you' || assigned.has(id)) continue;
      const a = AI(id); if(!a || a.inj>0) continue;
      if((rankOf(id)||9999) > 140 || plan[oly.id].length>=56) break;
      if((per[a.country]||0)>=4 || R()<.08) continue;
      per[a.country] = (per[a.country]||0)+1;
      plan[oly.id].push(id); assigned.add(id);
    }
  }
  const ranked = state.rankList.filter(id=>id!=='you');
  const unranked = state.ai.filter(a=>!state.rankIdx[a.id]).map(a=>a.id);
  const off = state.week>=47;
  const dudeIds = state.ai.filter(a=>a.dude).map(a=>a.id);
  for(const id of dudeIds.concat(ranked.filter(x=>!dudeIds.includes(x)), unranked.filter(x=>!dudeIds.includes(x)))){
    if(assigned.has(id)) continue;
    const a = AI(id); if(!a) continue;
    if(a.inj>0 || a.busy>=state.absWeek) continue;
    if(R() < (off?.2:.1)) continue;
    const rk = rankOf(id) ?? 9999;
    const cands = order.filter(e => e.tier!=='FIN' && e.tier!=='OLY' && rk <= (a.dude ? TIERS[e.tier].qual : TIERS[e.tier].main) && plan[e.id].length < (e.tier==='ITF' ? (a.dude ? 32 : 4) : TIERS[e.tier].draw));
    if(a.dude && rk>60 && cands.length && cands[0].tier!=='ITF' && R()<.35) continue;
    if(!cands.length) continue;
    const top = cands[0].tier;
    if(top==='A250' && rk<=12 && R()<.55) continue;
    if(top==='CH' && rk<=70 && R()<.85) continue;
    if(top==='ITF' && rk<=180 && R()<.9) continue;
    const e = pick(cands.filter(c=>c.tier===top));
    plan[e.id].push(id); assigned.add(id);
    if(e.weeks===2) a.busy = state.absWeek+1;
  }
  state.plan = plan; state.evs = evs;
}
function addResult(p, pts, ev){ if(p && pts>0) p.results.push({aw:state.absWeek, pts, ev}); }
function crown(id, ev, name, extra){
  const T = TIERS[ev.tier];
  if(ev.tier==='SLAM') dudeSlam(id, ev);
  schedLog().champs[ev.id] = name;
  if(ev.tier==='SLAM'){ state.cur.majors[ev.city] = {id, name};
    const cp = id ? getP(id) : null;
    if(cp){ const age = ageOf(cp), r = state.rec, e = {name, age, year:state.season, ev:slamName(ev.city)};
      if(!r.young || age < r.young.age) r.young = e;
      if(!r.old || age > r.old.age) r.old = e; } }
  if(ev.tier==='FIN') state.cur.finals = {id, name};
  if(ev.tier==='IQ') state.cur.iq = {id, name};
  if(ev.tier==='OLY') state.cur.olympics = {city:ev.city, gold:{id,name}, ...(extra||{})};
  const a = id && id!=='you' ? AI(id) : null;
  if(a && T.rank>=4 && ev.tier!=='OLY'){ a.titles = (a.titles||0)+1; if(ev.tier==='SLAM') a.majors = (a.majors||0)+1; if(ev.tier==='M1000') a.m1000 = (a.m1000||0)+1; }
  if(a && ev.tier==='OLY') a.golds = (a.golds||0)+1;
}
function simEvent(ev, ids){
  const T = TIERS[ev.tier];
  ids = ids.filter(id=>AI(id));
  if(ev.tier==='FIN'){ for(const id of state.rankList){ if(ids.length>=8) break; if(id!=='you' && !ids.includes(id)) ids.push(id); } }
  let ents = ids.map(id => ({id, k:rankOf(id)||5000, r:rateOn(AI(id), ev.surface)}));
  ents.sort((a,b)=>a.k-b.k);
  ents = ents.slice(0, T.draw);
  while(ents.length<T.draw) ents.push({id:null, k:9000, r:rnd(...T.fill)});
  let cur = seedPlace(ents);
  const Rn = Math.log2(T.draw); let round = 0; const sfl = []; let runner = null;
  while(cur.length>1){
    const next=[];
    for(let i=0;i<cur.length;i+=2){
      const a=cur[i], b=cur[i+1];
      const w = quickWin(a.r, b.r, T.bo) ? a : b, l = w===a?b:a;
      if(l.id) addResult(AI(l.id), evPts(ev, Rn-round), evName(ev));
      if(cur.length===4) sfl.push(l);
      if(cur.length===2) runner = l;
      next.push(w);
    }
    cur = next; round++;
  }
  const ch = cur[0];
  const nm = p => p && p.id ? AI(p.id).name : 'A qualifier';
  if(ch.id) addResult(AI(ch.id), evPts(ev,0), evName(ev));
  let extra = null;
  if(ev.tier==='OLY'){ const b = quickWin(sfl[0].r, sfl[1].r, 3) ? sfl[0] : sfl[1]; extra = {silver:{id:runner.id, name:nm(runner)}, bronze:{id:b.id, name:nm(b)}}; }
  crown(ch.id, ev, nm(ch), extra);
  dudeFinal(ev, ch.id, runner && runner.id);
  if(T.rank>=5) news(ev.tier==='OLY' ? `${nm(ch)} wins Olympic gold in ${ev.city}.` : `${nm(ch)} wins the ${evName(ev)}.`);
}

/* ---------- Laver Cup ---------- */
function laverSchedule(eu, world){
  const s = [], orderS = [[3,4,5],[2,1,0],[0,1,2]], dbl = [[0,3],[1,2],[0,1]];
  for(let d=0; d<3; d++){
    for(const i of orderS[d]) s.push({day:d+1, type:'S', eu:[eu[i]], world:[world[d===2 ? (i+1)%3 : i]]});
    s.push({day:d+1, type:'D', eu:[eu[dbl[d][0]],eu[dbl[d][1]]], world:[world[dbl[d][0]],world[dbl[d][1]]]});
  }
  return s;
}
function teamRating(ids){ return ids.reduce((s,id)=>s+rateOn(getP(id),'indoor'),0)/ids.length; }
function laverRecord(T, m, side, score){
  m.result = side; m.score = score;
  T.score[side] += m.decider ? 1 : m.day;
  T.idx++;
  if(T.score.eu>=13 || T.score.world>=13) T.done = true;
}
function laverStep(T){
  while(!T.done){
    if(T.idx >= T.schedule.length){
      if(T.score.eu===T.score.world){ T.schedule.push({day:3, type:'D', eu:T.eu.slice(0,2), world:T.world.slice(0,2), decider:true}); }
      else { T.done = true; break; }
    }
    const m = T.schedule[T.idx];
    if(m.eu.includes('you') || m.world.includes('you')) return;
    laverRecord(T, m, quickWin(teamRating(m.eu), teamRating(m.world), 3) ? 'eu' : 'world', null);
  }
}
function simLaverQuick(){
  const L = state.laverPlan; if(!L) return;
  const fix = (team, isEu) => { const out = team.filter(id=>id!=='you'); for(const id of state.rankList){ if(out.length>=6) break; const p=getP(id); if(id!=='you' && p && !out.includes(id) && EUROPE.has(p.country)===isEu) out.push(id); } return out; };
  const T = {eu:fix(L.eu,true), world:fix(L.world,false), score:{eu:0,world:0}, idx:0, done:false};
  if(T.eu.length<6 || T.world.length<6) return;
  T.schedule = laverSchedule(T.eu, T.world);
  laverStep(T);
  const w = T.score.eu>T.score.world ? 'Team Europe' : 'Team World';
  state.cur.laver = {winner:w, score:`${Math.max(T.score.eu,T.score.world)}–${Math.min(T.score.eu,T.score.world)}`, city:L.city};
  news(`${w} wins the Laver Cup in ${L.city}, ${state.cur.laver.score}.`);
}
function acceptLaver(){
  const L = state.laverPlan; if(!L || !L.invited || state.player.injured>0) return;
  const side = L.eu.includes('you') ? 'eu' : 'world';
  const T = {kind:'laver', city:L.city, side, eu:L.eu.slice(), world:L.world.slice(), score:{eu:0,world:0}, idx:0, done:false};
  T.schedule = laverSchedule(T.eu, T.world);
  laverStep(T);
  state.team = T; state.player.trainStreak = 0; ui.report = null; ui.tactic='bal'; ui.tab='week';
  save(); render();
}
function finishLaver(){
  const T = state.team, P = state.player;
  const winSide = T.score.eu>T.score.world ? 'eu' : 'world', won = winSide===T.side;
  const w = winSide==='eu' ? 'Team Europe' : 'Team World';
  const score = `${Math.max(T.score.eu,T.score.world)}–${Math.min(T.score.eu,T.score.world)}`;
  const mine = T.schedule.filter(m=>m.type==='S' && (m.eu[0]==='you'||m.world[0]==='you') && m.result!==undefined);
  const mw = mine.filter(m=>m.result===T.side).length;
  const fee = (100000 + fame()*9000)*ms(), bonus = won ? 250000*ms() : 0;
  P.money += fee + bonus; P.stats.prize += fee + bonus; P.season.prize += fee + bonus;
  P.stats.laver.push({year:state.season, city:T.city, won, w:mw, l:mine.length-mw});
  state.cur.laver = {winner:w, score, city:T.city, you:true};
  news(`${w} wins the Laver Cup in ${T.city}, ${score}. ${P.name} went ${mw}–${mine.length-mw} in singles.`, true);
  ui.report = {title:`Laver Cup, ${T.city}`, lines:[`${won?'Champions':'Beaten'}: ${w} ${score}`, `Appearance fee <span class="pos">+${money(fee)}</span>${bonus?` · winners' bonus <span class="pos">+${money(bonus)}</span>`:''}`]};
  state.team = null;
  if(state.laverPlan) state.laverPlan.played = true;
  advance(1, null, []);
  render();
}

/* ---------- Davis Cup ---------- */
const DAVIS_WEEKS = [6,15,39,48];
const DAVIS_ROUNDS = ['First round','Quarterfinal','Semifinal','Final'];
const cname = c => COUNTRY_NAMES[c] || c;
function nationPlayers(c, taken){
  const out = [];
  for(const id of state.rankList){
    if(out.length>=2) break;
    const p = getP(id); if(!p || p.country!==c) continue;
    if(id==='you' ? state.player.injured>0 : (p.inj>0 || (taken && taken.has(id)))) continue;
    out.push(id);
  }
  return out;
}
function initDavis(){
  const by = {};
  for(const id of state.rankList){ const p = getP(id); if(!p) continue; (by[p.country] = by[p.country] || []).push(id); }
  const nations = Object.entries(by).filter(([c,ids])=>ids.length>=2).map(([c,ids])=>({c, str: ids.slice(0,2).reduce((s,id)=>s+ovr(getP(id).attrs),0)})).sort((a,b)=>b.str-a.str).slice(0,16);
  if(nations.length<16){ state.davis = null; return; }
  const alive = seedPlace(nations.map(n=>n.c));
  state.davis = {year:state.season, alive, round:0, winner:null, bo: state.season<2019 ? 5 : 3, userPlayed:false, log:[]};
  const mine = state.player.country;
  news(alive.includes(mine) ? `Davis Cup ${state.season}: ${cname(mine)} is in the 16-nation World Group.` : `Davis Cup ${state.season}: ${cname(mine)} did not make the World Group this year.`);
}
function tieRubbers(pa, pb){ return [{type:'S',a:[pa[0]],b:[pb[1]]},{type:'S',a:[pa[1]],b:[pb[0]]},{type:'D',a:pa.slice(0,2),b:pb.slice(0,2)},{type:'S',a:[pa[0]],b:[pb[0]]},{type:'S',a:[pa[1]],b:[pb[1]]}]; }
function davisRecord(T, r, side, score){ r.result = side; r.score = score; T.score[side]++; T.idx++; if(T.score[side]>=3) T.done = true; }
function davisStep(T){
  while(!T.done && T.idx < T.rubbers.length){
    const r = T.rubbers[T.idx];
    if(r.a.includes('you') || r.b.includes('you')) return;
    davisRecord(T, r, quickWin(teamRating(r.a), teamRating(r.b), T.bo) ? 'a' : 'b', null);
  }
  T.done = true;
}
function fillTeam(ids, c){
  const out = ids.filter(x=>x!=='you');
  for(const id of state.rankList){ if(out.length>=2) break; const p=getP(id); if(id!=='you' && p && p.country===c && !out.includes(id)) out.push(id); }
  return out;
}
function resolveDavisTies(){
  const D = state.davis, plan = state.davisPlan;
  if(!D || !plan || plan.resolved) return;
  for(const t of plan.ties){
    if(t.winner) continue;
    const pa = fillTeam(t.pa, t.a), pb = fillTeam(t.pb, t.b);
    if(pa.length<2 || pb.length<2){ t.winner = pa.length>=pb.length ? t.a : t.b; t.score='w/o'; continue; }
    const T = {rubbers:tieRubbers(pa,pb), score:{a:0,b:0}, idx:0, done:false, bo:D.bo};
    davisStep(T);
    t.winner = T.score.a>T.score.b ? t.a : t.b; t.score = `${Math.max(T.score.a,T.score.b)}–${Math.min(T.score.a,T.score.b)}`;
  }
  const mine = state.player.country;
  for(const t of plan.ties){ if(t.a===mine || t.b===mine){ const opp = t.a===mine?t.b:t.a; news(`Davis Cup ${DAVIS_ROUNDS[D.round].toLowerCase()}: ${cname(mine)} ${t.winner===mine?'beat':'lost to'} ${cname(opp)}, ${t.score}.`, true); } }
  D.log.push({round:D.round, ties:plan.ties.map(t=>({a:t.a,b:t.b,winner:t.winner,score:t.score}))});
  D.alive = plan.ties.map(t=>t.winner);
  D.round++;
  plan.resolved = true;
  if(D.alive.length===1){
    D.winner = D.alive[0];
    const fin = plan.ties[0];
    state.cur.davis = {winner:cname(D.winner), code:D.winner, score:fin.score, runner:cname(fin.a===D.winner?fin.b:fin.a)};
    news(`${cname(D.winner)} win the Davis Cup, beating ${state.cur.davis.runner} ${fin.score} in the final.`, D.winner===mine);
    if(D.winner===mine && D.userPlayed) state.player.flags.davisWin = true;
  }
}
function simDavisWeek(){ resolveDavisTies(); }
function acceptDavis(){
  const plan = state.davisPlan; if(!plan || plan.userTie<0 || plan.played || state.player.injured>0) return;

function resolvePress(i){

}

function resolveOffcourt(i){

    case 'family:1': add('men',-2); P.fatigue = clamp(P.fatigue+10,0,100); msg = 'You stayed on tour, but it weighs on you. −2 mental, +10 fatigue.'; break;
    case 'doc:0': P.money += e.v; P.stats.endorse += e.v; P.fameBonus = (P.fameBonus||0)+8; add('men',-1.5); msg = `Documentary signed: +${money(e.v)}, +8 fame, −1.5 mental.`; news(`A streaming documentary about ${P.name} is announced.`, true); break;

    case 'found:0': if(pay(e.v)){ P.foundation = true; msg = 'Your foundation is launched. Permanent +4 fame.'; news(`${P.name} launches a foundation for kids' tennis.`, true); } break;
    case 'found:1': if(pay(8000*s)){ P.fameBonus = (P.fameBonus||0)+3; msg = 'Donation made. +3 fame.'; } break;

function weeklyUpkeep(lines){
  const P = state.player, rk = rankOf('you'), s = ms();
  const coach = COACHES[P.coach];
  const L = LIFESTYLES[P.life||'std'], living = L.cost*s, cc = coachCost()*s;

  lines.push(`Living costs (${L.name.toLowerCase()}) <span class="neg">−${money(living)}</span>${cc?` · coach <span class="neg">−${money(cc)}</span>`:''}${staffCost?` · support staff <span class="neg">−${money(staffCost)}</span>`:''}`);
  if(P.money<0){ const int = Math.max(10*s, -P.money*.005); P.money -= int; lines.push(`You are in debt. Interest <span class="neg">−${money(int)}</span>`); }

  if(en){ P.money += en; P.stats.endorse += en; lines.push(`Endorsements <span class="pos">+${money(en)}</span>`); }

  if(P.money<0 && P.coach>0){ lines.push(`You are out of money. ${esc(coachName())} has left.`); P.coach=0; P.coachInfo=null; }
  { const c = coachOf(); if(c){ c.mood = clamp((c.mood??60) + ((c.mood??60)<60 ? .8 : -.2), 0, 100); if(c.mood<12 && R()<.35) coachLeaves(lines, 'He lost faith after the recent results.'); } }
  { const D = dblState(); if(D.partner && !AI(D.partner)){ lines.push(`Your doubles partner ${esc(D.pname||'')} has retired. Pick a new one on the Player tab.`); D.partner = null; } }
  if(P.money<0 && (staffLvl('physio')||staffLvl('fitness'))){ P.staff = {agent:P.staff.agent}; lines.push('You could not pay your support staff, so they left.'); }
  if(P.money<0 && (P.life==='comfort'||P.life==='lux')){ P.life = 'std'; lines.push('You are broke, so you have moved back to a standard lifestyle.'); }
  P.fameBonus = (P.fameBonus||0) > 0 ? Math.max(0, P.fameBonus - .15) : Math.min(0, (P.fameBonus||0) + .15);
  if(P.invest && P.invest.length){ P.invest = P.invest.filter(iv => { if(iv.due > state.absWeek) return true; const r = R(), back = r<.3 ? iv.amt*4 : r<.7 ? iv.amt : 0; P.money += back; lines.push(back>iv.amt ? `Your startup investment took off! <span class="pos">+${money(back)}</span>` : back ? `Your startup investment came back even: <span class="pos">+${money(back)}</span>` : 'Your startup investment failed. The money is gone.'); return false; }); }
  { const ft = staffTier('fitness'); if(ft && ft.sta && P.attrs.sta < P.pot.sta) P.attrs.sta = Math.min(P.pot.sta, P.attrs.sta + ft.sta); }
  P.fatigue = clamp(P.fatigue-(9 + (P.trait==='iron'?4:0) + L.rec + (P.recBonus||0) + (staffTier('physio')?staffTier('physio').rec:0)), 0, 100);
  if(P.injured>0){ P.injured--; if(P.injured===0) lines.push('You are cleared to play again.'); }

function aiWeekly(){

    if(a.target && ageOf(a)<=28){ const gap = Math.max(0, ovr(a.target)-ovr(a.attrs)); const g = rnd(.06,.11)*(.55 + gap/39*.9); for(const [k] of ATTRS) a.attrs[k] = Math.min(a.target[k], a.attrs[k]+g); }
  }

function advance(n, playedId, lines=[]){
  for(let k=0;k<n;k++){
    for(const ev of state.evs){ if(k===0 && ev.id===playedId) continue; simEvent(ev, state.plan[ev.id]||[]); }
    if(state.laverPlan && !state.laverPlan.played) simLaverQuick();
    if(state.davisPlan && !state.davisPlan.resolved) simDavisWeek();
    weeklyUpkeep(lines);
    state.week++; state.absWeek++;
    if(state.week>52) seasonRollover();
    aiWeekly();
    computeRanks(); recordRank(); checkMilestones(); checkDudeStory(); planWeek();
    if(state.over) break;
  }
  const rk = rankOf('you');
  checkAch(lines);
  flushStory(lines);

  if(ui.report) ui.report.lines = ui.report.lines.concat(lines); else ui.report = {title:'Week report', lines};

}
function retireAI(a, retired){

function seasonRollover(){
  const P = state.player, rk = rankOf('you');
  const y = state.season;
  if(rk===1) P.flags.yeNo1 = true;
  const rec = {year:y, rank:rk, w:P.season.w, l:P.season.l, titles:P.season.titles, prize:P.season.prize, age:ageOf(P)};
  P.seasons.push(rec);
  const no1 = state.rankList[0];
  state.history.push({year:y, majors:state.cur.majors, finals:state.cur.finals, iq:state.cur.iq, olympics:state.cur.olympics, laver:state.cur.laver, davis:state.cur.davis, no1:{id:no1, name:getP(no1)?.name}, you:rk});
  state.cur = {majors:{}, finals:null, olympics:null, laver:null, davis:null};
  state.recap = rec;
  P.season = {w:0,l:0,titles:0,prize:0};
  state.season++; state.week = 1;
  const ny = state.season;
  const cut = state.absWeek - 60;
  P.results = P.results.filter(r=>r.aw>cut);
  { const D = dblState(); D.results = D.results.filter(r=>r.aw>cut); }
  for(const x of Object.values(state.h2hx||{})) x.heat = Math.max(0, (x.heat||0)-1);
  const ft = fameTier(fame()), ended = [];
  P.contracts = P.contracts.filter(c => {
    if(c.end < ny){ ended.push(`${c.brand} (contract expired)`); return false; }
    if(c.raise){ c.weekly = Math.round(c.weekly*(1+c.raise)); c.title = Math.round(c.title*(1+c.raise)); c.major = Math.round(c.major*(1+c.raise)); }
    if(c.tier > ft+1 && (c.kind||'normal')==='normal'){ ended.push(`${c.brand} (ended early after a poor season)`); return false; }
    return true;
  });
  if(ended.length) news(`Sponsor changes: ${ended.join(', ')}.`, true);
  const retired = [], keep = [];
  for(const a of state.ai){
    a.results = a.results.filter(r=>r.aw>cut);
    const age = ny - a.born;
    if(a.real){
      const r = ROSTER[a.real.i];
      const past = r.to!==0 ? ny>r.to : (age>=38 || (age>=34 && R()<.2));
      if(past){ retireAI(a, retired); continue; }
      const lvl = r.to!==0 || ny<=2026 ? lvlFor(r, ny) : ovr(a.attrs) - rnd(.5,2.5);
      shiftAttrs(a.attrs, lvl - ovr(a.attrs));
    } else {
      let d;
      if(a.target && age<=28) d = 0;
      else if(age<=24) d = Math.min(Math.max(0,(a.pot||60)-ovr(a.attrs)), rnd(.8,3.5));
      else if(age<=28) d = a.dude ? rnd(-.3,.6) : rnd(-.8,1);
      else if(age<=31) d = rnd(-2,.3);
      else d = rnd(-3.2,-.8);
      shiftAttrs(a.attrs, d);
      if(age>=36 || (age>=33 && R()<.25 && !a.dude) || (ovr(a.attrs)<52 && R()<.5)){ retireAI(a, retired); continue; }
    }
    keep.push(a);
  }
  const have = new Set(keep.filter(a=>a.real).map(a=>a.real.i));
  const arrivals = [];
  for(const r of ROSTER){ if(r.fr===ny && !have.has(r.i) && activeIn(r, ny)){ keep.push(makeReal(r, ny)); if(r.pk<=10) arrivals.push(r.n); } }
  while(keep.length < 300) keep.push(makeFictional(ny, rnd(55,64), ri(18,19)));
  state.ai = keep; aiMap = null;
  if(retired.length) news(`Retirements: ${retired.join(', ')}.`);
  if(arrivals.length) news(`New on tour this season: ${arrivals.join(', ')}.`);
  news(`The ${ny} season begins. You are now ${ageOf(P)}.`, true);
  genOffers('the season review');
  if(ageOf(P)>=37){ state.over = true; state.overReason = 'At 37, your body has had enough. Time to hang up the rackets.'; }
}

function olyBlocked(){
  const P = state.player, rk = rankOf('you') || 9999;
  if(rk>60) return 'Olympic entry needs a top-60 ranking';
  const better = state.rankList.filter(id=>id!=='you' && (rankOf(id)||9999)<rk && getP(id)?.country===P.country).length;
  if(better>=4) return `${COUNTRY_NAMES[P.country]||P.country}'s four spots are taken`;
  return null;
}
function eligibility(ev){
  const P = state.player;
  if(P.injured>0) return {type:'no', why:`Injured, ${P.injured} wk left`};
  const T = TIERS[ev.tier], rk = rankOf('you');
  if(ev.tier==='ITF') return {type:'main'};
  if(ev.tier==='FIN') return rk && rk<=8 ? {type:'main'} : {type:'no', why:'Top 8 only'};
  if(ev.tier==='IQ') return rk && rk<=64 ? {type:'main'} : {type:'no', why:'Top 64 invited only'};
  if(ev.tier==='OLY'){ const b = olyBlocked(); return b ? {type:'no', why:b} : {type:'main'}; }
  if(rk && rk<=T.main) return {type:'main'};
  if(rk && rk<=T.qual) return {type:'qual'};
  return {type:'no', why:`Qualifying needs top ${T.qual}`};
}
function train(focus){
  const P = state.player;

/* fatigue floor after a tournament, by how far you went: champion, runner-up, SF, QF, R16, R32, earlier rounds, qualifying loss */
const DEPTH_FAT = [75, 60, 45, 35, 25, 15, 10, 8];
function tourOutcome(t){
  const T = TIERS[t.ev.tier], Rn = Math.log2(T.draw), s = ms(), ev = t.ev;
  const q = t.type==='qual' ? T.qPts : 0;
  if(t.stage==='qual') return {pts:0, prize:(t.withdrew&&t.qRound===0?0:T.qPrize)*s, label:`Lost in qualifying${t.withdrew?' (withdrew)':''}`, idx:-1};
  if(ev.tier==='OLY'){
    if(t.champion==='you') return {pts:evPts(ev,0), prize:0, label:'Olympic gold medal', idx:0, medal:'Gold'};
    const r = t.reached.you, idx = Rn - r;
    if(idx===1) return {pts:evPts(ev,1), prize:0, label:'Olympic silver medal', idx:1, medal:'Silver'};
    if(idx===2) return t.bronze==='you' ? {pts:evPts(ev,2)+(ev.noPts?0:70), prize:0, label:'Olympic bronze medal', idx:2, medal:'Bronze'} : {pts:evPts(ev,2), prize:0, label:'Fourth place', idx:2};
    return {pts:evPts(ev,idx), prize:0, label:`Lost in the ${roundName(T.draw, r).toLowerCase()}${t.withdrew?' (withdrew)':''}`, idx};
  }
  if(t.champion==='you') return {pts:evPts(ev,0)+q, prize:T.prize[0]*s, label:'Champion', idx:0};
  const r = t.reached.you, idx = Rn - r;
  const label = idx===1 ? 'Runner-up' : `Lost in the ${roundName(T.draw, r).toLowerCase()}`;
  return {pts:evPts(ev,idx)+q, prize:T.prize[idx]*s, label: label + (t.withdrew?' (withdrew)':''), idx};
}

function toggleAuto(){
